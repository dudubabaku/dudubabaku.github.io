<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fa">
<title>Flowday</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-soft: #f1f3f6;
    --text: #111318;
    --text-soft: #69707d;
    --text-muted: #9aa1ac;
    --line: #e7e9ed;
    --accent: #111318;
    --accent-soft: #e9ebef;
    --shadow-sm: 0 4px 16px rgba(20, 24, 32, 0.05);
    --shadow-md: 0 12px 36px rgba(20, 24, 32, 0.08);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Inter", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================
   APP
========================= */

#app {
    min-height: 100vh;
}

/* =========================
   LANDING
========================= */

.landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

.landing-inner {
    width: min(1120px, calc(100% - 48px));
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 70px 0 50px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.04em;
}

.brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: #111318;
    display: grid;
    place-items: center;
    color: white;
    font-size: 14px;
    font-weight: 800;
}

.hero {
    display: grid;
    grid-template-columns: 1fr 0.82fr;
    align-items: center;
    gap: 80px;
    margin-top: 80px;
}

.hero-copy {
    max-width: 590px;
}

.hero-title {
    font-size: clamp(44px, 6vw, 76px);
    line-height: 1.07;
    letter-spacing: -0.065em;
    font-weight: 800;
}

.hero-title span {
    display: block;
}

.hero-description {
    margin-top: 26px;
    color: var(--text-soft);
    font-size: 17px;
    line-height: 1.7;
    letter-spacing: -0.025em;
}

.start-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 38px;
    width: min(360px, 100%);
}

.primary-btn,
.google-btn {
    height: 56px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}

.primary-btn {
    background: #111318;
    color: white;
    box-shadow: 0 8px 22px rgba(17, 19, 24, .15);
}

.primary-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(17, 19, 24, .2);
}

.google-btn {
    background: white;
    color: #111318;
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
}

.google-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.google-icon {
    width: 18px;
    height: 18px;
}

/* =========================
   HERO VISUAL
========================= */

.hero-visual {
    position: relative;
    min-height: 430px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.visual-glow {
    position: absolute;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    background: #e9ebef;
    filter: blur(2px);
}

.mockup {
    position: relative;
    width: min(330px, 90%);
    background: #111318;
    border-radius: 38px;
    padding: 10px;
    box-shadow:
        0 35px 70px rgba(20, 24, 32, .18),
        0 8px 20px rgba(20, 24, 32, .08);
    transform: rotate(3deg);
}

.mockup-screen {
    background: #f7f8fa;
    border-radius: 30px;
    min-height: 500px;
    padding: 22px;
    overflow: hidden;
}

.mockup-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mockup-date {
    font-size: 11px;
    color: var(--text-muted);
}

.mockup-title {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.06em;
    margin-top: 26px;
}

.mockup-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 17px;
    padding: 17px;
    margin-top: 20px;
    box-shadow: var(--shadow-sm);
}

.mockup-time {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
}

.mockup-plan {
    font-size: 15px;
    font-weight: 700;
    margin-top: 8px;
}

.mockup-task {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 13px;
}

.mockup-check {
    width: 16px;
    height: 16px;
    border-radius: 5px;
    border: 1px solid #cfd3da;
    background: white;
}

.quote-area {
    margin-top: 65px;
    max-width: 650px;
}

.quote-box {
    position: relative;
    padding: 20px 48px 20px 30px;
}

.quote-open,
.quote-close {
    position: absolute;
    color: #c5c9d0;
    font-family: Georgia, serif;
    font-size: 42px;
    line-height: 1;
}

.quote-open {
    left: 0;
    top: 4px;
}

.quote-close {
    right: 0;
    bottom: -4px;
}

.quote-text {
    color: #777e89;
    font-family: Georgia, "Noto Sans KR", serif;
    font-style: italic;
    font-size: 15px;
    line-height: 1.7;
}

.quote-author {
    margin-top: 8px;
    color: #a0a5ad;
    font-size: 12px;
}

.quote-change {
    margin-top: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: transparent;
    display: grid;
    place-items: center;
    color: #8e949e;
    transition: background .2s ease, color .2s ease, transform .3s ease;
}

.quote-change:hover {
    background: #eceef1;
    color: #111318;
}

.quote-change:active {
    transform: rotate(180deg);
}

.quote-change svg {
    width: 17px;
    height: 17px;
}

.landing-footer {
    width: min(1120px, calc(100% - 48px));
    margin: 0 auto;
    padding: 20px 0 28px;
    color: #a0a5ad;
    font-size: 11px;
}

/* =========================
   SCHEDULE
========================= */

.schedule-page {
    min-height: 100vh;
    padding-bottom: 110px;
}

.schedule-container {
    width: min(980px, calc(100% - 40px));
    margin: 0 auto;
    padding-top: 28px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: white;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease;
}

.back-btn:hover {
    transform: translateX(-2px);
}

.back-btn svg {
    width: 19px;
    height: 19px;
}

.profile-btn {
    height: 42px;
    padding: 0 14px;
    border-radius: 13px;
    background: white;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
    color: #343841;
    font-size: 13px;
    font-weight: 700;
    box-shadow: var(--shadow-sm);
}

.profile-letter {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #111318;
    color: white;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 800;
}

.date-header {
    margin-top: 42px;
}

.date-label {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
}

.date-title-row {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-top: 7px;
}

.date-title {
    font-size: clamp(35px, 5vw, 52px);
    letter-spacing: -0.065em;
    font-weight: 800;
}

.calendar-icon {
    width: 28px;
    height: 28px;
    color: #858b95;
}

.date-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 26px 2px 12px;
    scrollbar-width: none;
}

.date-strip::-webkit-scrollbar {
    display: none;
}

.date-item {
    flex: 0 0 67px;
    height: 76px;
    border-radius: 17px;
    background: white;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #8c929c;
    transition: all .2s ease;
}

.date-item:hover {
    transform: translateY(-2px);
}

.date-item.active {
    background: #111318;
    border-color: #111318;
    color: white;
    box-shadow: 0 8px 20px rgba(17, 19, 24, .16);
}

.date-week {
    font-size: 10px;
    font-weight: 600;
}

.date-number {
    font-size: 17px;
    font-weight: 800;
}

.plan-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 20px;
}

.empty-state {
    background: white;
    border: 1px dashed #d8dbe0;
    border-radius: var(--radius-lg);
    padding: 65px 25px;
    text-align: center;
    color: var(--text-muted);
}

.empty-state strong {
    display: block;
    color: #545a64;
    font-size: 15px;
    margin-bottom: 8px;
}

.empty-state p {
    font-size: 13px;
}

.plan-card {
    position: relative;
    background: white;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 25px 27px 25px;
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease, box-shadow .2s ease;
}

.plan-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.plan-time {
    color: #8b919b;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: -0.01em;
}

.plan-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 15px;
    margin-top: 7px;
}

.plan-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.04em;
}

.delete-plan {
    flex: 0 0 auto;
    width: 31px;
    height: 31px;
    border-radius: 10px;
    background: #f2f3f5;
    color: #8d929a;
    display: grid;
    place-items: center;
    transition: background .2s ease, color .2s ease;
}

.delete-plan:hover {
    background: #e7e9ed;
    color: #111318;
}

.delete-plan svg {
    width: 15px;
    height: 15px;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin-top: 21px;
}

.task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 31px;
    cursor: pointer;
}

.task-checkbox {
    appearance: none;
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
    border: 1.5px solid #cdd1d8;
    border-radius: 7px;
    background: white;
    position: relative;
    transition: all .2s ease;
}

.task-checkbox:checked {
    background: #111318;
    border-color: #111318;
}

.task-checkbox:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 3px;
    width: 6px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

.task-text {
    font-size: 16px;
    line-height: 1.45;
    color: #333841;
    font-weight: 500;
    letter-spacing: -0.025em;
    transition: color .2s ease, text-decoration .2s ease;
}

.task-item.completed .task-text {
    color: #a4a9b1;
    text-decoration: line-through;
}

.task-minutes {
    margin-left: auto;
    color: #a0a5ad;
    font-size: 12px;
    white-space: nowrap;
}

.fab {
    position: fixed;
    right: max(24px, calc((100vw - 980px) / 2));
    bottom: 28px;
    width: 58px;
    height: 58px;
    border-radius: 20px;
    background: #111318;
    color: white;
    display: grid;
    place-items: center;
    box-shadow: 0 12px 30px rgba(17, 19, 24, .22);
    transition: transform .2s ease, box-shadow .2s ease;
    z-index: 20;
}

.fab:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 34px rgba(17, 19, 24, .27);
}

.fab svg {
    width: 23px;
    height: 23px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 23, .42);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn .2s ease;
}

.modal {
    width: min(500px, 100%);
    max-height: min(760px, calc(100vh - 40px));
    overflow-y: auto;
    background: white;
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 30px 80px rgba(10, 13, 18, .22);
    animation: modalIn .25s ease;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.modal-title {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.045em;
}

.modal-close {
    width: 35px;
    height: 35px;
    border-radius: 11px;
    background: #f1f2f4;
    color: #777d86;
    display: grid;
    place-items: center;
}

.form-group {
    margin-top: 23px;
}

.form-label {
    display: block;
    font-size: 12px;
    color: #7e848e;
    font-weight: 700;
    margin-bottom: 8px;
}

.form-input {
    width: 100%;
    height: 48px;
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 0 14px;
    outline: none;
    background: #fafbfc;
    color: var(--text);
    transition: border .2s ease, box-shadow .2s ease;
}

.form-input:focus {
    border-color: #aeb4bd;
    box-shadow: 0 0 0 4px #f0f1f3;
}

.time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.task-input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.task-input {
    flex: 1;
}

.minutes-input {
    width: 88px;
}

.add-task-btn {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    border-radius: 13px;
    background: #111318;
    color: white;
    display: grid;
    place-items: center;
}

.add-task-btn svg {
    width: 18px;
    height: 18px;
}

.modal-task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
}

.modal-task {
    min-height: 44px;
    border-radius: 12px;
    background: #f5f6f8;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
}

.modal-task-text {
    flex: 1;
    color: #454a53;
}

.remove-task {
    width: 25px;
    height: 25px;
    border-radius: 8px;
    color: #969ba4;
    background: transparent;
}

.modal-submit {
    width: 100%;
    height: 53px;
    margin-top: 25px;
    border-radius: 15px;
    background: #111318;
    color: white;
    font-size: 14px;
    font-weight: 700;
}

/* Confirm */

.confirm-modal {
    width: min(390px, 100%);
    background: white;
    border-radius: 26px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(10, 13, 18, .22);
    animation: modalIn .25s ease;
}

.confirm-icon {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    background: #f0f1f3;
    display: grid;
    place-items: center;
    margin: 0 auto 18px;
}

.confirm-icon svg {
    width: 22px;
    height: 22px;
    color: #555b65;
}

.confirm-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.04em;
}

.confirm-description {
    color: #8b919a;
    font-size: 13px;
    margin-top: 8px;
}

.confirm-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 23px;
}

.confirm-btn {
    height: 48px;
    border-radius: 13px;
    font-size: 14px;
    font-weight: 700;
}

.confirm-yes {
    background: #111318;
    color: white;
}

.confirm-no {
    background: #f0f1f3;
    color: #555b64;
}

/* =========================
   ANIMATION
========================= */

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {
    .landing-inner {
        width: min(100% - 36px, 600px);
        padding-top: 38px;
    }

    .hero {
        grid-template-columns: 1fr;
        gap: 50px;
        margin-top: 65px;
    }

    .hero-copy {
        max-width: none;
    }

    .hero-visual {
        min-height: 370px;
    }

    .mockup {
        width: 270px;
    }

    .mockup-screen {
        min-height: 420px;
    }

    .quote-area {
        margin-top: 35px;
    }

    .landing-footer {
        width: calc(100% - 36px);
    }
}

@media (max-width: 560px) {
    .landing-inner {
        width: calc(100% - 32px);
        padding: 28px 0 35px;
    }

    .brand {
        font-size: 16px;
    }

    .hero {
        margin-top: 58px;
        gap: 35px;
    }

    .hero-title {
        font-size: clamp(42px, 13vw, 58px);
    }

    .hero-description {
        font-size: 15px;
        margin-top: 20px;
    }

    .start-buttons {
        margin-top: 30px;
    }

    .hero-visual {
        min-height: 320px;
    }

    .visual-glow {
        width: 250px;
        height: 250px;
    }

    .mockup {
        width: 235px;
        border-radius: 31px;
    }

    .mockup-screen {
        border-radius: 24px;
        min-height: 370px;
        padding: 17px;
    }

    .mockup-title {
        font-size: 21px;
    }

    .quote-area {
        margin-top: 22px;
    }

    .quote-box {
        padding-right: 35px;
    }

    .quote-text {
        font-size: 14px;
    }

    .schedule-container {
        width: calc(100% - 28px);
        padding-top: 18px;
    }

    .date-header {
        margin-top: 30px;
    }

    .date-title {
        font-size: 38px;
    }

    .date-strip {
        padding-top: 20px;
    }

    .date-item {
        flex-basis: 60px;
        height: 70px;
    }

    .plan-card {
        padding: 21px 19px;
        border-radius: 21px;
    }

    .plan-title {
        font-size: 18px;
    }

    .task-text {
        font-size: 15px;
    }

    .task-checkbox {
        width: 20px;
        height: 20px;
        flex-basis: 20px;
    }

    .fab {
        right: 18px;
        bottom: 20px;
        width: 55px;
        height: 55px;
        border-radius: 18px;
    }

    .modal {
        padding: 22px;
        border-radius: 23px;
    }

    .time-row {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =========================
         LANDING
    ========================== -->
    <section id="landingPage" class="landing">

        <div class="landing-inner">

            <div class="brand">
                <div class="brand-mark">F</div>
                <span>flowday</span>
            </div>

            <div class="hero">

                <div class="hero-copy">

                    <h1 class="hero-title">
                        오늘 해야 할 일을,
                        <span>한눈에</span>
                    </h1>

                    <p class="hero-description">
                        오늘의 공부 흐름을 한곳에 모아보세요.
                    </p>

                    <div class="start-buttons">

                        <button class="primary-btn" id="startBtn">
                            시작하기
                        </button>

                        <button class="google-btn" id="googleBtn">
                            <svg class="google-icon" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.42-.18-2.09H12v3.96h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.15c1.85-1.7 2.91-4.2 2.91-7.26z"/>
                                <path fill="#34A853" d="M12 21.8c2.64 0 4.85-.87 6.47-2.36l-3.15-2.45c-.87.58-1.98.92-3.32.92-2.55 0-4.71-1.72-5.49-4.04H3.25v2.53A9.77 9.77 0 0 0 12 21.8z"/>
                                <path fill="#FBBC05" d="M6.51 13.87A5.87 5.87 0 0 1 6.2 12c0-.65.11-1.28.31-1.87V7.6H3.25A9.8 9.8 0 0 0 2.2 12c0 1.58.38 3.07 1.05 4.4l3.26-2.53z"/>
                                <path fill="#EA4335" d="M12 6.09c1.44 0 2.73.5 3.75 1.49l2.81-2.81C16.85 3.1 14.64 2.2 12 2.2a9.77 9.77 0 0 0-8.75 5.4l3.26 2.53C7.29 7.81 9.45 6.09 12 6.09z"/>
                            </svg>
                            Google 계정으로 시작
                        </button>

                    </div>

                    <div class="quote-area">

                        <div class="quote-box">

                            <span class="quote-open">“</span>

                            <div id="quoteText" class="quote-text"></div>

                            <div id="quoteAuthor" class="quote-author"></div>

                            <span class="quote-close">”</span>

                        </div>

                        <button
                            class="quote-change"
                            id="quoteChangeBtn"
                            aria-label="다른 명언 보기"
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M20 11a8.1 8.1 0 0 0-14.7-4.7L4 8"/>
                                <path d="M4 4v4h4"/>
                                <path d="M4 13a8.1 8.1 0 0 0 14.7 4.7L20 16"/>
                                <path d="M20 20v-4h-4"/>
                            </svg>
                        </button>

                    </div>

                </div>

                <div class="hero-visual">

                    <div class="visual-glow"></div>

                    <div class="mockup">

                        <div class="mockup-screen">

                            <div class="mockup-top">

                                <span style="font-weight:800;font-size:12px;">F</span>
                            </div>

                            <div class="mockup-title">
                                오늘의 계획
                            </div>

                            <div class="mockup-card">

                                <div class="mockup-time">
                                    10:00 ~ 14:00
                                </div>

                                <div class="mockup-plan">
                                    오전 공부
                                </div>

                                <div class="mockup-task">
                                    <span class="mockup-check"></span>
                                    집중해서 공부하기
                                </div>

                                <div class="mockup-task">
                                    <span class="mockup-check"></span>
                                    오늘 배운 내용 정리
                                </div>

                                <div class="mockup-task">
                                    <span class="mockup-check"></span>
                                    오답 다시 확인
                                </div>

                            </div>

                            <div class="mockup-card">

                                <div class="mockup-time">
                                    15:00 ~ 18:00
                                </div>

                                <div class="mockup-plan">
                                    오후 공부
                                </div>

                                <div class="mockup-task">
                                    <span class="mockup-check"></span>
                                    해야 할 일 끝내기
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="landing-footer">
            flowday · plan your day, your way.
        </div>

    </section>


    <!-- =========================
         SCHEDULE
    ========================== -->

    <section id="schedulePage" class="schedule-page hidden">

        <div class="schedule-container">

            <div class="topbar">

                <button class="back-btn" id="backBtn" aria-label="뒤로가기">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>

                <button class="profile-btn" id="profileBtn">
                    <span class="profile-letter" id="profileLetter">G</span>
                    <span id="profileText">내 플랜</span>
                </button>

            </div>

            <div class="date-header">

                <div class="date-label">TODAY'S FLOW</div>

                <div class="date-title-row">

                    <h2 class="date-title" id="currentDateTitle"></h2>

                    <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="3" y="4.5" width="18" height="17" rx="3"/>
                        <path d="M8 2.5v4M16 2.5v4M3 9h18"/>
                    </svg>

                </div>

            </div>

            <div class="date-strip" id="dateStrip"></div>

            <div class="plan-list" id="planList"></div>

        </div>

        <button class="fab" id="addPlanBtn" aria-label="계획 추가">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
        </button>

    </section>

</div>


<!-- =========================
     ADD PLAN MODAL
========================== -->

<div class="modal-backdrop hidden" id="planModal">

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                새로운 계획
            </div>

            <button class="modal-close" id="closePlanModal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>

        </div>

        <div class="form-group">

            <label class="form-label">날짜</label>

            <input
                class="form-input"
                type="date"
                id="planDate"
            >

        </div>

        <div class="form-group">

            <label class="form-label">계획 이름</label>

            <input
                class="form-input"
                type="text"
                id="planName"
                placeholder="예: 오전 공부"
            >

        </div>

        <div class="form-group">

            <label class="form-label">시간</label>

            <div class="time-row">

                <input
                    class="form-input"
                    type="time"
                    id="planStart"
                    value="10:00"
                >

                <input
                    class="form-input"
                    type="time"
                    id="planEnd"
                    value="12:00"
                >

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">해야 할 일</label>

            <div class="task-input-row">

                <input
                    class="form-input task-input"
                    type="text"
                    id="taskInput"
                    placeholder="할 일을 추가하세요"
                >

                <input
                    class="form-input minutes-input"
                    type="number"
                    id="taskMinutes"
                    min="10"
                    step="10"
                    value="30"
                    placeholder="분"
                >

                <button class="add-task-btn" id="addTaskBtn" aria-label="할 일 추가">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>

            </div>

            <div class="modal-task-list" id="modalTaskList"></div>

        </div>

        <button class="modal-submit" id="savePlanBtn">
            계획 추가하기
        </button>

    </div>

</div>


<!-- =========================
     DELETE CONFIRM MODAL
========================== -->

<div class="modal-backdrop hidden" id="deleteModal">

    <div class="confirm-modal">

        <div class="confirm-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M12 8v5"/>
                <path d="M12 16.5h.01"/>
                <path d="M10.3 3.8L2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z"/>
            </svg>
        </div>

        <div class="confirm-title">
            계획을 삭제하시겠습니까?
        </div>

        <div class="confirm-description">
            삭제한 계획은 다시 복구할 수 없습니다.
        </div>

        <div class="confirm-buttons">

            <!-- 요청대로 예가 먼저 -->
            <button class="confirm-btn confirm-yes" id="confirmDeleteBtn">
                예
            </button>

            <button class="confirm-btn confirm-no" id="cancelDeleteBtn">
                아니오
            </button>

        </div>

    </div>

</div>


<script>
/* =========================================================
   FLOWDAY
========================================================= */

const STORAGE_KEY = "flowday_plans_v4";

/* =========================
   STATE
========================= */

let plans = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

let selectedDate = formatDate(new Date());

let modalTasks = [];

let deleteTargetId = null;


/* =========================
   ELEMENTS
========================= */

const landingPage = document.getElementById("landingPage");
const schedulePage = document.getElementById("schedulePage");

const startBtn = document.getElementById("startBtn");
const googleBtn = document.getElementById("googleBtn");
const backBtn = document.getElementById("backBtn");

const profileLetter = document.getElementById("profileLetter");
const profileText = document.getElementById("profileText");

const currentDateTitle = document.getElementById("currentDateTitle");
const dateStrip = document.getElementById("dateStrip");
const planList = document.getElementById("planList");

const addPlanBtn = document.getElementById("addPlanBtn");

const planModal = document.getElementById("planModal");
const closePlanModal = document.getElementById("closePlanModal");

const planDate = document.getElementById("planDate");
const planName = document.getElementById("planName");
const planStart = document.getElementById("planStart");
const planEnd = document.getElementById("planEnd");

const taskInput = document.getElementById("taskInput");
const taskMinutes = document.getElementById("taskMinutes");
const addTaskBtn = document.getElementById("addTaskBtn");
const modalTaskList = document.getElementById("modalTaskList");
const savePlanBtn = document.getElementById("savePlanBtn");

const deleteModal = document.getElementById("deleteModal");
const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");

const quoteText = document.getElementById("quoteText");
const quoteAuthor = document.getElementById("quoteAuthor");
const quoteChangeBtn = document.getElementById("quoteChangeBtn");


/* =========================
   QUOTES
   실제 출처가 비교적 명확한 인용만 사용
========================= */

const quotes = [
    {
        text: "Genius is one percent inspiration, ninety-nine percent perspiration.",
        author: "Thomas Edison"
    },
    {
        text: "Education is the most powerful weapon which you can use to change the world.",
        author: "Nelson Mandela"
    },
    {
        text: "The roots of education are bitter, but the fruit is sweet.",
        author: "Aristotle"
    },
    {
        text: "Learning never exhausts the mind.",
        author: "Leonardo da Vinci"
    },
    {
        text: "The expert in anything was once a beginner.",
        author: "Helen Hayes"
    },
    {
        text: "Reading furnishes the mind only with materials of knowledge; it is thinking that makes what we read ours.",
        author: "John Locke"
    },
    {
        text: "Read not to contradict and confute; nor to believe and take for granted; but to weigh and consider.",
        author: "Francis Bacon"
    },
    {
        text: "Reading maketh a full man, conference a ready man, and writing an exact man.",
        author: "Francis Bacon"
    },
    {
        text: "Education is our passport to the future, for tomorrow belongs only to the people who prepare for it today.",
        author: "Malcolm X"
    }
];

let quoteIndex = Math.floor(Math.random() * quotes.length);

function renderQuote() {
    const quote = quotes[quoteIndex];

    quoteText.textContent = quote.text;
    quoteAuthor.textContent = "© " + quote.author;
}

quoteChangeBtn.addEventListener("click", () => {

    quoteIndex = (quoteIndex + 1) % quotes.length;

    renderQuote();

});


/* =========================
   DATE FUNCTIONS
========================= */

function formatDate(date) {

    const year = date.getFullYear();

    const month = String(date.getMonth() + 1).padStart(2, "0");

    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function parseDate(dateString) {

    const [year, month, day] = dateString.split("-").map(Number);

    return new Date(year, month - 1, day);
}


function getKoreanWeekday(date) {

    const days = [
        "일",
        "월",
        "화",
        "수",
        "목",
        "금",
        "토"
    ];

    return days[date.getDay()];
}


function renderCurrentDate() {

    const date = parseDate(selectedDate);

    currentDateTitle.textContent =
        `${date.getMonth() + 1}월 ${date.getDate()}일`;

}


function renderDateStrip() {

    dateStrip.innerHTML = "";

    const centerDate = parseDate(selectedDate);

    for (let i = -3; i <= 3; i++) {

        const date = new Date(centerDate);

        date.setDate(centerDate.getDate() + i);

        const dateString = formatDate(date);

        const item = document.createElement("button");

        item.className =
            "date-item" +
            (dateString === selectedDate ? " active" : "");

        item.innerHTML = `
            <span class="date-week">
                ${getKoreanWeekday(date)}
            </span>
            <span class="date-number">
                ${date.getDate()}
            </span>
        `;

        item.addEventListener("click", () => {

            selectedDate = dateString;

            renderSchedule();

        });

        dateStrip.appendChild(item);
    }
}


/* =========================
   PLAN RENDERING
========================= */

function renderPlans() {

    planList.innerHTML = "";

    const filteredPlans = plans
        .filter(plan => plan.date === selectedDate)
        .sort((a, b) => a.start.localeCompare(b.start));


    if (filteredPlans.length === 0) {

        planList.innerHTML = `
            <div class="empty-state">
                <strong>오늘의 계획이 없습니다.</strong>
                <p>오른쪽 아래 + 버튼으로 계획을 추가해보세요.</p>
            </div>
        `;

        return;
    }


    filteredPlans.forEach(plan => {

        const card = document.createElement("div");

        card.className = "plan-card";

        card.innerHTML = `

            <div class="plan-time">
                ${plan.start} ~ ${plan.end}
            </div>

            <div class="plan-title-row">

                <div class="plan-title">
                    ${escapeHTML(plan.name)}
                </div>

                <button
                    class="delete-plan"
                    data-id="${plan.id}"
                    aria-label="계획 삭제"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 6l12 12M18 6L6 18"/>
                    </svg>
                </button>

            </div>

            <div class="task-list">

                ${plan.tasks.map((task, index) => `

                    <label
                        class="task-item ${task.completed ? "completed" : ""}"
                        data-plan-id="${plan.id}"
                        data-task-index="${index}"
                    >

                        <input
                            type="checkbox"
                            class="task-checkbox"
                            ${task.completed ? "checked" : ""}
                        >

                        <span class="task-text">
                            ${escapeHTML(task.text)}
                        </span>

                        ${
                            task.minutes
                            ? `<span class="task-minutes">${task.minutes}분</span>`
                            : ""
                        }

                    </label>

                `).join("")}

            </div>
        `;

        planList.appendChild(card);
    });


    document.querySelectorAll(".delete-plan").forEach(button => {

        button.addEventListener("click", (event) => {

            event.stopPropagation();

            deleteTargetId = button.dataset.id;

            deleteModal.classList.remove("hidden");

        });

    });


    document.querySelectorAll(".task-item").forEach(item => {

        item.addEventListener("click", () => {

            const planId = item.dataset.planId;

            const taskIndex = Number(item.dataset.taskIndex);

            toggleTask(planId, taskIndex);

        });

    });

}


function toggleTask(planId, taskIndex) {

    const plan = plans.find(
        item => String(item.id) === String(planId)
    );

    if (!plan) return;

    plan.tasks[taskIndex].completed =
        !plan.tasks[taskIndex].completed;

    savePlans();

    renderPlans();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   SAVE
========================= */

function savePlans() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(plans)
    );

}


/* =========================
   SCHEDULE
========================= */

function renderSchedule() {

    renderCurrentDate();

    renderDateStrip();

    renderPlans();

}


/* =========================
   OPEN SCHEDULE
========================= */

function openSchedule() {

    landingPage.classList.add("hidden");

    schedulePage.classList.remove("hidden");

    renderSchedule();

}


startBtn.addEventListener("click", openSchedule);


/*
    지금은 Firebase 연결 전이므로
    Google 버튼을 누르면 게스트 상태로
    일정 화면으로 들어가도록 유지.
    
    Firebase 연결 후 이 부분만 실제
    Google Authentication으로 교체하면 됨.
*/

googleBtn.addEventListener("click", () => {

    openSchedule();

});


/* =========================
   BACK
========================= */

backBtn.addEventListener("click", () => {

    schedulePage.classList.add("hidden");

    landingPage.classList.remove("hidden");

});


/* =========================
   ADD PLAN MODAL
========================= */

function openPlanModal() {

    planModal.classList.remove("hidden");

    planDate.value = selectedDate;

    planName.value = "";

    planStart.value = "10:00";

    planEnd.value = "12:00";

    taskInput.value = "";

    taskMinutes.value = "30";

    modalTasks = [];

    renderModalTasks();

}


function closeModal() {

    planModal.classList.add("hidden");

}


addPlanBtn.addEventListener("click", openPlanModal);

closePlanModal.addEventListener("click", closeModal);


/* =========================
   MODAL TASKS
========================= */

function addModalTask() {

    const text = taskInput.value.trim();

    if (!text) {

        taskInput.focus();

        return;
    }

    let minutes = Number(taskMinutes.value);

    if (!minutes || minutes < 10) {
        minutes = 10;
    }

    /*
       10분 단위로 보정
    */

    minutes = Math.round(minutes / 10) * 10;

    modalTasks.push({
        text,
        minutes,
        completed: false
    });

    taskInput.value = "";

    taskMinutes.value = "30";

    renderModalTasks();

    taskInput.focus();

}


addTaskBtn.addEventListener("click", addModalTask);


taskInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {

        event.preventDefault();

        addModalTask();

    }

});


function renderModalTasks() {

    modalTaskList.innerHTML = "";

    modalTasks.forEach((task, index) => {

        const item = document.createElement("div");

        item.className = "modal-task";

        item.innerHTML = `

            <span class="modal-task-text">
                ${escapeHTML(task.text)}
            </span>

            <span style="font-size:11px;color:#9298a1;">
                ${task.minutes}분
            </span>

            <button
                class="remove-task"
                data-index="${index}"
            >
                ×
            </button>
        `;

        modalTaskList.appendChild(item);

    });


    document.querySelectorAll(".remove-task").forEach(button => {

        button.addEventListener("click", () => {

            const index = Number(button.dataset.index);

            modalTasks.splice(index, 1);

            renderModalTasks();

        });

    });

}


/* =========================
   SAVE PLAN
========================= */

savePlanBtn.addEventListener("click", () => {

    const date = planDate.value;

    const name = planName.value.trim();

    const start = planStart.value;

    const end = planEnd.value;


    if (!date) {

        alert("날짜를 선택해주세요.");

        return;
    }


    if (!name) {

        alert("계획 이름을 입력해주세요.");

        planName.focus();

        return;
    }


    if (!start || !end) {

        alert("시간을 입력해주세요.");

        return;
    }


    if (start >= end) {

        alert("종료 시간은 시작 시간보다 늦어야 합니다.");

        return;
    }


    if (modalTasks.length === 0) {

        alert("해야 할 일을 하나 이상 추가해주세요.");

        taskInput.focus();

        return;
    }


    const newPlan = {

        id: Date.now().toString(),

        date,

        name,

        start,

        end,

        tasks: modalTasks.map(task => ({
            ...task
        }))

    };


    plans.push(newPlan);

    savePlans();

    selectedDate = date;

    closeModal();

    renderSchedule();

});


/* =========================
   DELETE
========================= */

confirmDeleteBtn.addEventListener("click", () => {

    if (!deleteTargetId) return;

    plans = plans.filter(
        plan => String(plan.id) !== String(deleteTargetId)
    );

    savePlans();

    deleteTargetId = null;

    deleteModal.classList.add("hidden");

    renderSchedule();

});


cancelDeleteBtn.addEventListener("click", () => {

    deleteTargetId = null;

    deleteModal.classList.add("hidden");

});


/* =========================
   PROFILE
========================= */

profileBtn.addEventListener("click", () => {

    /*
        Firebase 연결 후:
        G → Google 프로필 이니셜
        내 플랜 → 사용자 이름
        으로 변경 예정
    */

});


/* =========================
   CLOSE MODALS OUTSIDE
========================= */

planModal.addEventListener("click", (event) => {

    if (event.target === planModal) {
        closeModal();
    }

});


deleteModal.addEventListener("click", (event) => {

    if (event.target === deleteModal) {

        deleteTargetId = null;

        deleteModal.classList.add("hidden");

    }

});


/* =========================
   INIT
========================= */

renderQuote();

</script>

</body>
</html>
