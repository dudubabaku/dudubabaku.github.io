<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>flowday</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Noto Sans KR",
        sans-serif;
    background:#f4f6f9;
    color:#101828;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}


/* =========================
   NAV
========================= */

.nav{
    height:68px;
    width:100%;

    background:rgba(255,255,255,.94);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 26px;

    border-bottom:1px solid #e8ebef;

    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:21px;
    font-weight:850;
    letter-spacing:-1.2px;
    color:#0c1526;
}

.logo span{
    opacity:.4;
}

.profile{
    display:none;
    align-items:center;
    gap:8px;

    font-size:12px;
    font-weight:700;
    color:#475467;
}

.profile.show{
    display:flex;
}

.profile-icon{
    width:30px;
    height:30px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#0c1526;
    color:white;

    font-size:11px;
}


/* =========================
   PAGE
========================= */

.page{
    display:none;
}

.page.active{
    display:block;
}


/* =========================
   LANDING
========================= */

.landing{
    min-height:calc(100vh - 68px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:45px 22px 60px;

    background:
        radial-gradient(
            circle at 90% 10%,
            #e6ebf2 0,
            transparent 28%
        ),
        radial-gradient(
            circle at 5% 90%,
            #ffffff 0,
            transparent 30%
        ),
        #f4f6f9;
}

.landing-content{
    width:min(680px,100%);
    text-align:center;
}

.small-label{
    display:inline-flex;

    padding:8px 13px;

    border:1px solid #dfe4eb;
    border-radius:999px;

    background:#fff;

    font-size:10px;
    font-weight:850;
    letter-spacing:1.8px;

    color:#667085;

    margin-bottom:21px;
}

.landing h1{
    margin:0;

    color:#0c1526;

    font-size:
        clamp(43px,8vw,72px);

    line-height:1.04;

    letter-spacing:-4.5px;
}

.landing-description{
    margin:20px auto 27px;

    max-width:470px;

    color:#667085;

    font-size:15px;
    line-height:1.7;

    letter-spacing:-.3px;
}

.start-button{
    width:min(300px,100%);

    padding:16px 20px;

    border-radius:15px;

    background:#0c1526;
    color:white;

    font-size:15px;
    font-weight:800;

    box-shadow:
        0 12px 30px rgba(12,21,38,.18);

    transition:.18s;
}

.start-button:hover{
    transform:translateY(-2px);
}

.google-button{
    width:min(300px,100%);

    margin:10px auto 0;

    padding:14px 20px;

    display:block;

    border-radius:15px;

    background:white;

    border:1px solid #dfe3e8;

    color:#344054;

    font-size:14px;
    font-weight:750;
}

.google-letter{
    margin-right:8px;

    font-weight:900;
    color:#4285f4;
}

.login-description{
    margin-top:11px;

    font-size:10px;

    color:#98a2b3;
}


/* =========================
   LANDING QUOTE
========================= */

.landing-quote{
    margin:30px auto 0;

    width:min(450px,100%);

    text-align:left;
}

.quote-label{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:7px;

    padding:0 2px;
}

.quote-label span{
    color:#a0a8b5;

    font-size:9px;
    font-weight:800;

    letter-spacing:1.4px;
}


/* 명언 변경 버튼 */

.quote-change{
    width:29px;
    height:29px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;

    background:transparent;
    border:none;

    color:#8b95a3;

    transition:.25s;
}

.quote-change:hover{
    color:#4f5968;
}

.quote-change svg{
    width:17px;
    height:17px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;

    transition:transform .3s ease;
}

.quote-change:active svg{
    transform:rotate(180deg);
}


/* 명언 */

.quote-card{
    position:relative;

    background:transparent;

    padding:
        4px
        24px
        4px
        24px;

    color:#737d8b;

    box-shadow:none;
}


/* 왼쪽 위 따옴표 */

.quote-mark{
    position:absolute;

    left:1px;
    top:0;

    color:#aab2bd;

    font-family:Georgia,serif;

    font-size:22px;

    line-height:1;
}


/* 오른쪽 아래 따옴표 */

.quote-end-mark{
    position:absolute;

    right:1px;
    bottom:0;

    color:#aab2bd;

    font-family:Georgia,serif;

    font-size:22px;

    line-height:1;
}

.quote-text{
    margin:0;

    color:#687281;

    font-family:
        Georgia,
        "Noto Serif KR",
        serif;

    font-size:13px;

    font-style:italic;

    line-height:1.6;

    letter-spacing:-.2px;
}

.quote-author{
    margin-top:7px;

    color:#9aa3ae;

    font-size:9.5px;

    font-style:italic;
}


/* =========================
   SCHEDULE
========================= */

.schedule-page{
    min-height:calc(100vh - 68px);

    background:#f4f6f9;
}

.schedule-container{
    width:min(1050px,100%);

    margin:auto;

    padding:
        35px
        24px
        100px;
}


/* 뒤로가기 */

.back-button{
    position:fixed;

    left:20px;
    top:82px;

    width:44px;
    height:44px;

    border-radius:50%;

    background:#fff;

    color:#0c1526;

    font-size:27px;

    box-shadow:
        0 8px 25px rgba(16,24,40,.10);

    z-index:20;
}


/* =========================
   DATE HEADER
========================= */

.day-header{
    display:flex;

    justify-content:space-between;
    align-items:flex-end;

    margin-bottom:23px;
}

.date-text{
    color:#0c1526;

    font-size:
        clamp(34px,7vw,54px);

    font-weight:850;

    letter-spacing:-3px;

    line-height:1;
}

.day-name{
    margin-top:8px;

    color:#667085;

    font-size:13px;
    font-weight:650;
}

.calendar-button{
    width:48px;
    height:48px;

    border-radius:15px;

    background:#fff;

    border:1px solid #e4e8ed;

    color:#0c1526;

    display:flex;
    align-items:center;
    justify-content:center;
}

.calendar-button svg{
    width:21px;
    height:21px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================
   DATE STRIP
========================= */

.date-strip{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:
        2px 1px 16px;

    scrollbar-width:none;
}

.date-strip::-webkit-scrollbar{
    display:none;
}

.date-item{
    flex:0 0 auto;

    min-width:64px;

    padding:10px 8px;

    border-radius:15px;

    background:white;

    border:1px solid #e3e7ed;

    color:#7a8493;

    text-align:center;
}

.date-item strong{
    display:block;

    color:#101828;

    font-size:16px;

    margin-bottom:3px;
}

.date-item small{
    font-size:10px;
}

.date-item.active{
    background:#0c1526;

    border-color:#0c1526;

    color:#dfe6ef;
}

.date-item.active strong{
    color:#fff;
}


/* =========================
   PLAN CARD
========================= */

.plan-card{
    background:white;

    border:1px solid #e3e7ec;

    border-radius:25px;

    padding:22px;

    margin-bottom:16px;

    box-shadow:
        0 8px 28px rgba(16,24,40,.045);
}

.plan-header{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;
}

.plan-time{
    color:#7a8697;

    font-size:13px;

    font-weight:800;
}

.plan-title{
    margin-top:5px;

    color:#101828;

    font-size:22px;

    font-weight:850;

    letter-spacing:-.8px;
}

.plan-progress{
    margin-top:6px;

    color:#8a94a3;

    font-size:11px;
}

.delete-plan{
    width:34px;
    height:34px;

    border-radius:11px;

    background:#f3f5f7;

    color:#667085;

    font-size:19px;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   TASK
========================= */

.task-list{
    margin-top:18px;

    display:flex;

    flex-direction:column;
}

.task{
    min-height:61px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:13px 2px;

    border-bottom:1px solid #e8ebef;
}

.task:last-child{
    border-bottom:none;
}

.task-check{
    width:22px;
    height:22px;

    flex:0 0 auto;

    border-radius:7px;

    background:white;

    border:1.5px solid #aeb7c3;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:12px;
    font-weight:900;
}

.task.completed .task-check{
    background:#20a66a;
    border-color:#20a66a;
}

.task-text{
    flex:1;

    color:#1d2939;

    font-size:14px;

    font-weight:650;

    line-height:1.4;
}

.task.completed .task-text{
    color:#8a94a3;

    text-decoration:line-through;
}

.task-minutes{
    padding:5px 8px;

    background:#f5f7f9;

    border-radius:8px;

    color:#8993a2;

    font-size:10px;
}


/* =========================
   EMPTY
========================= */

.empty{
    background:white;

    border:1px dashed #d7dce4;

    border-radius:24px;

    padding:60px 20px;

    text-align:center;

    color:#8993a2;
}

.empty-icon{
    font-size:35px;
    margin-bottom:10px;
}

.empty-title{
    color:#344054;
    font-weight:800;
}

.empty-text{
    margin-top:8px;

    font-size:12px;

    line-height:1.7;
}


/* =========================
   FLOATING ADD
========================= */

.floating-add{
    position:fixed;

    right:25px;
    bottom:25px;

    width:58px;
    height:58px;

    border-radius:19px;

    background:#0c1526;

    color:white;

    font-size:30px;

    box-shadow:
        0 15px 35px rgba(12,21,38,.25);

    z-index:15;
}


/* =========================
   ADD PLAN MODAL
========================= */

.modal-background{
    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:rgba(12,21,38,.45);

    backdrop-filter:blur(7px);

    align-items:center;
    justify-content:center;

    padding:18px;
}

.modal-background.open{
    display:flex;
}

.modal{
    width:min(600px,100%);

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:27px;

    padding:25px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.2);
}

.modal-title{
    margin:0;

    color:#101828;

    font-size:25px;

    letter-spacing:-1px;
}

.modal-subtitle{
    margin:6px 0 22px;

    color:#7a8493;

    font-size:12px;

    line-height:1.5;
}

.input-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:11px;
}

.form-field{
    margin-bottom:14px;
}

.form-label{
    display:block;

    margin-bottom:6px;

    color:#475467;

    font-size:11px;

    font-weight:800;
}

.form-input{
    width:100%;

    padding:12px;

    border-radius:12px;

    border:1px solid #dfe3e8;

    background:#fbfcfd;

    outline:none;
}

.form-input:focus{
    border-color:#0c1526;

    box-shadow:
        0 0 0 3px #edf0f4;
}


/* 새 할 일 */

.new-task-row{
    display:flex;

    gap:7px;

    margin-bottom:8px;
}

.new-task-name{
    flex:1;
}

.new-task-time{
    width:80px;
}

.remove-task{
    width:40px;

    border-radius:11px;

    background:#f2f4f7;

    color:#667085;
}

.add-task{
    padding:10px 12px;

    border-radius:11px;

    background:#eef1f5;

    color:#0c1526;

    font-size:12px;

    font-weight:800;
}

.modal-actions{
    display:flex;

    gap:9px;

    margin-top:18px;
}

.modal-cancel,
.modal-save{
    flex:1;

    padding:14px;

    border-radius:14px;

    font-size:13px;

    font-weight:800;
}

.modal-cancel{
    background:#f1f3f6;

    color:#344054;
}

.modal-save{
    background:#0c1526;

    color:white;
}


/* =========================
   DELETE CONFIRM MODAL
========================= */

.confirm-background{
    display:none;

    position:fixed;

    inset:0;

    z-index:300;

    background:rgba(12,21,38,.48);

    backdrop-filter:blur(8px);

    align-items:center;
    justify-content:center;

    padding:22px;
}

.confirm-background.open{
    display:flex;
}

.confirm-modal{
    width:min(340px,100%);

    background:white;

    border-radius:23px;

    padding:25px 22px 20px;

    text-align:center;

    box-shadow:
        0 25px 80px rgba(0,0,0,.22);

    animation:
        confirmAppear .18s ease-out;
}

@keyframes confirmAppear{

    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.confirm-icon{
    width:43px;
    height:43px;

    margin:0 auto 14px;

    border-radius:14px;

    background:#f2f4f7;

    display:flex;
    align-items:center;
    justify-content:center;
}

.confirm-icon svg{
    width:19px;
    height:19px;

    fill:none;

    stroke:#475467;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.confirm-title{
    margin:0;

    color:#101828;

    font-size:17px;

    font-weight:850;

    letter-spacing:-.5px;
}

.confirm-description{
    margin:8px 0 20px;

    color:#8a94a3;

    font-size:11px;

    line-height:1.5;
}

.confirm-actions{
    display:flex;

    gap:8px;
}


/* 예 먼저, 아니오 나중 */

.confirm-yes,
.confirm-no{
    flex:1;

    padding:12px;

    border-radius:12px;

    font-size:12px;

    font-weight:800;
}

.confirm-yes{
    background:#0c1526;

    color:white;
}

.confirm-no{
    background:#f1f3f6;

    color:#344054;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    z-index:500;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#0c1526;

    color:white;

    padding:12px 17px;

    border-radius:12px;

    font-size:12px;

    transition:.2s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .nav{
        height:60px;
        padding:0 17px;
    }

    .landing{
        min-height:calc(100vh - 60px);

        padding-top:35px;
    }

    .schedule-page{
        min-height:calc(100vh - 60px);
    }

    .schedule-container{
        padding:
            27px
            16px
            100px;
    }

    .back-button{
        top:73px;
        left:14px;

        width:40px;
        height:40px;
    }

    .input-grid{
        grid-template-columns:1fr;
    }

    .modal-background{
        align-items:flex-end;

        padding:0;
    }

    .modal{
        border-radius:
            27px
            27px
            0
            0;

        max-height:92vh;
    }

    .floating-add{
        right:18px;
        bottom:18px;
    }

    .landing-quote{
        margin-top:26px;
    }

}


/* =========================
   VERY SMALL
========================= */

@media(max-width:380px){

    .landing h1{
        letter-spacing:-3.5px;
    }

    .date-text{
        font-size:32px;
    }

    .plan-card{
        padding:18px;
    }

}

</style>
</head>


<body>

<div class="app">


<!-- =========================
     NAV
========================= -->

<header class="nav">

    <div class="logo">
        flow<span>day</span>
    </div>

    <div
        class="profile"
        id="profile"
    >

        <div class="profile-icon">
            F
        </div>

        내 플랜

    </div>

</header>



<!-- =========================
     LANDING PAGE
========================= -->

<section
    id="landingPage"
    class="page active"
>

    <div class="landing">

        <div class="landing-content">

            <div class="small-label">
                DAILY PLANNER
            </div>

            <h1>
                오늘 해야 할 일을,<br>
                한눈에.
            </h1>

            <p class="landing-description">
                오늘의 공부 흐름을 한곳에 모아보세요.
            </p>


            <button
                class="start-button"
                id="startButton"
            >
                시작하기
            </button>


            <button
                class="google-button"
                id="googleButton"
            >
                <span class="google-letter">
                    G
                </span>

                Google 계정으로 계속하기
            </button>


            <div class="login-description">
                로그인하면 계획 데이터를 이어서 사용할 수 있어요.
            </div>



            <!-- =====================
                 LANDING QUOTE
            ====================== -->

            <section class="landing-quote">

                <div class="quote-label">

                    <span>
                        TODAY'S STUDY QUOTE
                    </span>


                    <!-- 이모지 대신 SVG 순환 아이콘 -->

                    <button
                        class="quote-change"
                        id="quoteButton"
                        title="다른 명언"
                        aria-label="다른 명언"
                    >

                        <svg
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M20 7a8 8 0 0 0-13.6-2L4 7"
                            />

                            <path
                                d="M4 4v3h3"
                            />

                            <path
                                d="M4 17a8 8 0 0 0 13.6 2L20 17"
                            />

                            <path
                                d="M20 20v-3h-3"
                            />

                        </svg>

                    </button>

                </div>


                <div class="quote-card">

                    <!-- 왼쪽 위 -->

                    <div class="quote-mark">
                        “
                    </div>


                    <div
                        class="quote-text"
                        id="quoteText"
                    >
                    </div>


                    <!-- 오른쪽 아래 -->

                    <div class="quote-end-mark">
                        ”
                    </div>


                    <div
                        class="quote-author"
                        id="quoteAuthor"
                    >
                    </div>

                </div>

            </section>

        </div>

    </div>

</section>



<!-- =========================
     SCHEDULE PAGE
========================= -->

<section
    id="schedulePage"
    class="page"
>

    <button
        class="back-button"
        id="backButton"
        aria-label="뒤로가기"
    >
        ‹
    </button>


    <div class="schedule-page">

        <div class="schedule-container">


            <div class="day-header">

                <div>

                    <div
                        class="date-text"
                        id="bigDate"
                    >
                    </div>

                    <div
                        class="day-name"
                        id="bigDay"
                    >
                    </div>

                </div>


                <button
                    class="calendar-button"
                    id="calendarButton"
                    aria-label="달력"
                >

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="3"
                            y="4"
                            width="18"
                            height="17"
                            rx="3"
                        />

                        <line
                            x1="8"
                            y1="2.5"
                            x2="8"
                            y2="6"
                        />

                        <line
                            x1="16"
                            y1="2.5"
                            x2="16"
                            y2="6"
                        />

                        <line
                            x1="3"
                            y1="9"
                            x2="21"
                            y2="9"
                        />

                    </svg>

                </button>

            </div>


            <div
                class="date-strip"
                id="dateStrip"
            >
            </div>


            <div id="plans">
            </div>

        </div>


        <button
            class="floating-add"
            id="floatingAdd"
            aria-label="새 계획 추가"
        >
            +
        </button>

    </div>

</section>

     ADD PLAN MODAL
========================= -->

<div
    class="modal-background"

>

    <div class="modal">

        <h2 class="modal-title">

        <p class="modal-subtitle">

        <div class="input-grid">

            </button>

</div>

     DELETE CONFIRM
========================= -->

<div
    class="confirm-background"
    id="confirmBackground"
>

    <div class="confirm-modal">

        <div class="confirm-icon">

            <svg viewBox="0 0 24 24">

                <polyline
                    points="4 7 20 7"
                />

                <path
                    d="M9 7V4h6v3"
                />

                <path
                    d="M18 7l-1 13H7L6 7"
                />

                <line
                    x1="10"
                    y1="11"
                    x2="10"

                />

                <line
                    x1="14"

                />

            </svg>

        </div>


        <h3 class="confirm-title">

        </h3>

        </p>


        <!-- 요청대로 예 → 아니오 -->

        <div class="confirm-actions">

            <button

                예

<!-- =========================
     TOAST
========================= -->

<div
    class="toast"
    id="toast"
>
</div>



<script>

(function(){

"use strict";


/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
    "flowday_plans_v4";


let plans = [];

let selectedDate =
    getToday();

let deleteTargetId =
    null;


/* 저장된 계획 불러오기 */

try{

    plans =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"
        );

}catch(error){

    plans = [];

}


/* =========================
   QUOTES
========================= */

const quotes = [

    {
        korean:
        "배움은 결코 정신을 지치게 하지 않는다.",
        author:
        "Leonardo da Vinci"
    },

    {
        korean:
        "천재는 1%의 영감과 99%의 노력으로 이루어진다.",
        author:
        "Thomas Edison"
    },

    {
        korean:
        "교육의 뿌리는 쓰지만 그 열매는 달다.",
        author:
        "Aristotle"
    },

    {
        korean:
        "교육은 세상을 바꾸는 데 사용할 수 있는 가장 강력한 무기다.",
        author:
        "Nelson Mandela"
    },

    {
        korean:
        "교육은 미래로 가는 여권이다. 내일은 오늘을 준비하는 사람들의 것이기 때문이다.",
        author:
        "Malcolm X"
    },

    {
        korean:
        "독서는 사람을 충만하게 하고, 대화는 사람을 준비시키며, 글쓰기는 사람을 정확하게 만든다.",
        author:
        "Francis Bacon"
    },

    {
        korean:
        "나는 아직도 배우고 있다.",
        author:
        "Michelangelo"
    },

    {
        korean:
        "어떤 분야의 전문가도 한때는 초보자였다.",
        author:
        "Helen Hayes"
    },

    {
        korean:
        "유일한 선은 지식이고, 유일한 악은 무지다.",
        author:
        "Socrates"
    },

    {
        korean:
        "내일 죽을 사람처럼 살고, 영원히 살 사람처럼 배워라.",
        author:
        "Mahatma Gandhi"
    },

    {
        korean:
        "아는 것이 힘이다.",
        author:
        "Francis Bacon"
    },

    {
        korean:
        "배움의 아름다운 점은 아무도 그것을 당신에게서 빼앗을 수 없다는 것이다.",
        author:
        "B.B. King"
    }

];


let quoteIndex =
    Math.floor(
        Math.random()
        *
        quotes.length
    );


/* =========================
   UTIL
========================= */

function $(id){

    return document.getElementById(id);

}


function getToday(){

    const now =
        new Date();

    const local =
        new Date(
            now.getTime()
            -
            now.getTimezoneOffset()
            * 60000
        );

    return local
        .toISOString()
        .slice(0,10);

}


function savePlans(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(plans)
    );

}


function escapeHTML(value){

    return String(value)
        .replace(
            /[&<>"']/g,
            function(character){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[character];

            }
        );

}


function showToast(message){

    const toast =
        $("toast");

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================
   PAGE
========================= */

function showPage(pageId){

    document
        .querySelectorAll(".page")
        .forEach(
            page =>
            page.classList.remove(
                "active"
            )
        );

    $(pageId)
        .classList.add(
            "active"
        );

    window.scrollTo(
        0,
        0
    );

}


/* =========================
   DATE
========================= */

function getDayName(date){

    const names = [
        "일요일",
        "월요일",
        "화요일",
        "수요일",
        "목요일",
        "금요일",
        "토요일"
    ];

    return names[
        new Date(
            date + "T00:00:00"
        ).getDay()
    ];

}


function formatBigDate(date){

    const d =
        new Date(
            date + "T00:00:00"
        );

    return (
        d.getFullYear()
        +
        "."
        +
        String(
            d.getMonth()+1
        ).padStart(2,"0")
        +
        "."
        +
        String(
            d.getDate()
        ).padStart(2,"0")
    );

}


/* =========================
   QUOTE
========================= */

function renderQuote(){

    const quote =
        quotes[quoteIndex];

    $("quoteText").textContent =
        quote.korean;

    $("quoteAuthor").textContent =
        "﹣ " + quote.author;

}


function changeQuote(){

    let nextIndex;

    do{

        nextIndex =
            Math.floor(
                Math.random()
                *
                quotes.length
            );

    }while(
        nextIndex === quoteIndex
        &&
        quotes.length > 1
    );

    quoteIndex =
        nextIndex;

    renderQuote();

}


/* =========================
   DATE STRIP
========================= */

function renderDateStrip(){

    const base =
        new Date(
            selectedDate
            + "T00:00:00"
        );

    let html = "";

    for(
        let offset = -3;
        offset <= 7;
        offset++
    ){

        const date =
            new Date(base);

        date.setDate(
            base.getDate()
            +
            offset
        );

        const iso =
            new Date(
                date.getTime()
                -
                date.getTimezoneOffset()
                * 60000
            )
            .toISOString()
            .slice(0,10);

        html += `

            <button
                class="date-item
                ${iso === selectedDate
                    ? "active"
                    : ""
                }"
                data-date="${iso}"
            >

                <strong>
                    ${date.getDate()}
                </strong>

                <small>
                    ${
                        [
                            "일",
                            "월",
                            "화",
                            "수",
                            "목",
                            "금",
                            "토"
                        ][date.getDay()]
                    }
                </small>

            </button>

        `;

    }

    $("dateStrip").innerHTML =
        html;

    document
        .querySelectorAll(
            ".date-item"
        )
        .forEach(
            button => {

                button.onclick =
                    function(){

                        selectedDate =
                            this.dataset.date;

                        renderAll();

                    };

            }
        );

}


/* =========================
   PLANS
========================= */

function renderPlans(){

    const target =
        $("plans");

    const todayPlans =
        plans
            .filter(
                plan =>
                plan.date ===
                selectedDate
            )
            .sort(
                (a,b) =>
                a.start.localeCompare(
                    b.start
                )
            );


    if(
        todayPlans.length === 0
    ){

        target.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    +
                </div>

                <div class="empty-title">
                    오늘의 계획이 없어요
                </div>

                <div class="empty-text">
                    오른쪽 아래 + 버튼을 눌러<br>
                    첫 번째 시간 구간을 만들어보세요.
                </div>

            </div>

        `;

        return;

    }


    target.innerHTML =
        todayPlans
        .map(
            plan => {

                const completed =
                    plan.tasks
                    .filter(
                        task =>
                        task.done
                    )
                    .length;


                return `

                    <article
                        class="plan-card"
                    >

                        <div
                            class="plan-header"
                        >

                            <div>

                                <div
                                    class="plan-time"
                                >
                                    ${escapeHTML(
                                        plan.start
                                    )}
                                    &nbsp;~&nbsp;
                                    ${escapeHTML(
                                        plan.end
                                    )}
                                </div>

                                <div
                                    class="plan-title"
                                >
                                    ${escapeHTML(
                                        plan.title
                                    )}
                                </div>

                                <div
                                    class="plan-progress"
                                >
                                    ${completed}
                                    /
                                    ${plan.tasks.length}
                                    완료
                                </div>

                            </div>


                            <button
                                class="delete-plan"
                                data-delete="${plan.id}"
                                aria-label="계획 삭제"
                            >
                                ×
                            </button>

                        </div>


                        <div
                            class="task-list"
                        >

                            ${
                                plan.tasks
                                .map(
                                    (task,index) => `

                                        <div
                                            class="task
                                            ${
                                                task.done
                                                ? "completed"
                                                : ""
                                            }"
                                            data-task="${plan.id}:${index}"
                                        >

                                            <button
                                                class="task-check"
                                            >
                                                ${
                                                    task.done
                                                    ? "✓"
                                                    : ""
                                                }
                                            </button>

                                            <span
                                                class="task-text"
                                            >
                                                ${escapeHTML(
                                                    task.text
                                                )}
                                            </span>

                                            ${
                                                task.minutes
                                                ?
                                                `
                                                <span
                                                    class="task-minutes"
                                                >
                                                    ${escapeHTML(
                                                        task.minutes
                                                    )}분
                                                </span>
                                                `
                                                :
                                                ""
                                            }

                                        </div>

                                    `
                                )
                                .join("")
                            }

                        </div>

                    </article>

                `;

            }
        )
        .join("");


    /* 할 일 체크 */

    document
        .querySelectorAll(
            "[data-task]"
        )
        .forEach(
            element => {

                element.onclick =
                    function(){

                        const [
                            id,
                            index
                        ] =
                            this.dataset.task
                            .split(":");


                        const plan =
                            plans.find(
                                item =>
                                item.id === id
                            );


                        if(!plan){
                            return;
                        }


                        const taskIndex =
                            Number(index);


                        plan.tasks[
                            taskIndex
                        ].done =
                            !plan.tasks[
                                taskIndex
                            ].done;


                        savePlans();

                        renderPlans();

                    };

            }
        );


    /* 삭제 버튼 */

    document
        .querySelectorAll(
            "[data-delete]"
        )
        .forEach(
            button => {

                button.onclick =
                    function(event){

                        event.stopPropagation();

                        /*
                         * 바로 삭제하지 않고
                         * 확인창을 먼저 띄움.
                         */

                        deleteTargetId =
                            this.dataset.delete;

                        $("confirmBackground")
                            .classList.add(
                                "open"
                            );

                    };

            }
        );

}


/* =========================
   RENDER ALL
========================= */

function renderAll(){

    $("bigDate").textContent =
        formatBigDate(
            selectedDate
        );

    $("bigDay").textContent =
        getDayName(
            selectedDate
        );

    renderDateStrip();

    renderPlans();

    renderQuote();

}


/* =========================
   ADD TASK INPUT
========================= */

function addTaskInput(
    text = "",
    minutes = ""
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "new-task-row";

    row.innerHTML = `

        <input
            class="form-input new-task-name"
            placeholder="예: 국어 지문 분석"
            value="${escapeHTML(text)}"
        >

        <input
            class="form-input new-task-time"
            type="number"
            min="0"
            placeholder="분"
            value="${escapeHTML(minutes)}"
        >

        <button
            class="remove-task"
            type="button"
        >
            ×
        </button>

    `;


    row
        .querySelector(
            ".remove-task"
        )
        .onclick =
            function(){

                row.remove();

            };


    $("newTaskList")
        .appendChild(
            row
        );

}


/* =========================
   OPEN MODAL
========================= */

function openModal(){

    $("modalBackground")
        .classList.add(
            "open"
        );

    $("planDate").value =
        selectedDate;

    $("planName").value =
        "";

    $("startTime").value =
        "10:00";

    $("endTime").value =
        "14:00";

    $("newTaskList")
        .innerHTML =
        "";

    addTaskInput(
        "국어 지문 분석"
    );

    addTaskInput(
        "한국사 3.1운동 읽기"
    );

    addTaskInput(
        "수학 문제 풀이"
    );

}


function closeModal(){

    $("modalBackground")
        .classList.remove(
            "open"
        );

}


/* =========================
   DELETE CONFIRM
========================= */

function closeConfirm(){

    $("confirmBackground")
        .classList.remove(
            "open"
        );

    deleteTargetId =
        null;

}


/* =========================
   START
========================= */

$("startButton")
    .onclick =
    function(){

        showPage(
            "schedulePage"
        );

        renderAll();

    };


/* =========================
   GOOGLE
========================= */

$("googleButton")
    .onclick =
    function(){

        $("profile")
            .classList.add(
                "show"
            );

        showToast(
            "로그인 화면을 준비했어요."
        );

        setTimeout(
            function(){

                showPage(
                    "schedulePage"
                );

                renderAll();

            },
            350
        );

    };


/* =========================
   BACK
========================= */

$("backButton")
    .onclick =
    function(){

        showPage(
            "landingPage"
        );

    };


/* =========================
   ADD
========================= */

$("floatingAdd")
    .onclick =
    openModal;


/* =========================
   QUOTE CHANGE
========================= */

$("quoteButton")
    .onclick =
    changeQuote;


/* =========================
   MODAL
========================= */

$("cancelButton")
    .onclick =
    closeModal;


$("addTaskButton")
    .onclick =
    function(){

        addTaskInput();

    };


$("modalBackground")
    .onclick =
    function(event){

        if(
            event.target ===
            $("modalBackground")
        ){

            closeModal();

        }

    };


/* =========================
   SAVE PLAN
========================= */

$("saveButton")
    .onclick =
    function(){

        const date =
            $("planDate").value;

        const title =
            $("planName")
            .value
            .trim()
            ||
            "새 계획";

        const start =
            $("startTime").value;

        const end =
            $("endTime").value;


        const rows =
            [
                ...document.querySelectorAll(
                    ".new-task-row"
                )
            ];


        const tasks =
            rows
            .map(
                row => {

                    return {

                        text:
                            row
                            .querySelector(
                                ".new-task-name"
                            )
                            .value
                            .trim(),

                        minutes:
                            row
                            .querySelector(
                                ".new-task-time"
                            )
                            .value
                            .trim(),

                        done:false

                    };

                }
            )
            .filter(
                task =>
                task.text.length > 0
            );


        if(!date){

            showToast(
                "날짜를 선택해주세요."
            );

            return;

        }


        if(tasks.length === 0){

            showToast(
                "할 일을 하나 이상 추가해주세요."
            );

            return;

        }


        if(end <= start){

            showToast(
                "종료 시간은 시작 시간보다 늦어야 해요."
            );

            return;

        }


        plans.push({

            id:
                Date.now().toString()
                +
                Math.random()
                .toString(36)
                .slice(2),

            date:
                date,

            title:
                title,

            start:
                start,

            end:
                end,

            tasks:
                tasks

        });


        selectedDate =
            date;


        savePlans();

        closeModal();

        renderAll();

        showToast(
            "오늘의 계획을 추가했어요."
        );

    };


/* =========================
   DELETE: YES
========================= */

$("confirmYes")
    .onclick =
    function(){

        if(!deleteTargetId){

            closeConfirm();

            return;

        }


        plans =
            plans.filter(
                plan =>
                plan.id !==
                deleteTargetId
            );


        savePlans();

        closeConfirm();

        renderPlans();

        showToast(
            "계획을 삭제했어요."
        );

    };


/* =========================
   DELETE: NO
========================= */

$("confirmNo")
    .onclick =
    function(){

        closeConfirm();

    };


/* 확인창 바깥 클릭 */

$("confirmBackground")
    .onclick =
    function(event){

        if(
            event.target ===
            $("confirmBackground")
        ){

            closeConfirm();

        }

    };


/* =========================
   ESC
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Escape"){
            return;
        }

        closeModal();
        closeConfirm();

    }
);


/* =========================
   FIRST RENDER
========================= */

renderQuote();

})();

</script>

</body>
</html>
