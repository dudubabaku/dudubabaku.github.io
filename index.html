<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flowday</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #172033;
      --navy-2: #222d42;
      --text: #1d2430;
      --muted: #8b929d;
      --line: #e8eaee;
      --soft: #f7f8fa;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(20, 28, 43, 0.08);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(225, 229, 237, 0.45),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(235, 237, 241, 0.55),
          transparent 32%
        ),
        #fbfbfc;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
    }

    /* =========================
       LANDING
    ========================= */

    .landing-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .landing-page::before {
      content: "FLOW";
      position: absolute;
      left: -55px;
      bottom: 80px;
      font-size: clamp(100px, 17vw, 250px);
      font-weight: 800;
      letter-spacing: -0.08em;
      color: rgba(25, 34, 51, 0.025);
      pointer-events: none;
      user-select: none;
    }

    .landing-page::after {
      content: "DAY";
      position: absolute;
      right: -35px;
      top: 20%;
      font-size: clamp(100px, 17vw, 250px);
      font-weight: 800;
      letter-spacing: -0.08em;
      color: rgba(25, 34, 51, 0.02);
      pointer-events: none;
      user-select: none;
    }

    .landing-header {
      width: min(1280px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.05em;
    }

    .logo .day {
      color: #a2a7af;
      font-weight: 500;
    }

    .landing-main {
      width: min(1280px, calc(100% - 48px));
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 0.8fr);
      gap: 90px;
      align-items: center;
      position: relative;
      z-index: 1;
      padding: 45px 0 65px;
    }

    .hero-copy {
      padding-left: clamp(0px, 3vw, 50px);
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.14em;
      color: #969ca6;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: clamp(48px, 6vw, 82px);
      line-height: 1.04;
      letter-spacing: -0.065em;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .hero-description {
      color: #747b86;
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 36px;
    }

    .start-button {
      background: var(--navy);
      color: white;
      height: 54px;
      padding: 0 30px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 650;
      transition: 0.2s ease;
      box-shadow: 0 10px 25px rgba(23, 32, 51, 0.14);
    }

    .start-button:hover {
      transform: translateY(-2px);
      background: #111827;
      box-shadow: 0 14px 30px rgba(23, 32, 51, 0.18);
    }

    .google-button {
      margin-top: 12px;
      height: 48px;
      padding: 0 20px;
      border: 1px solid #e4e6ea;
      background: rgba(255,255,255,0.75);
      border-radius: 13px;
      color: #555c67;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .google-button:hover {
      background: white;
      border-color: #d6d9df;
    }

    .google-icon {
      font-weight: 700;
      margin-right: 8px;
    }

    /* Mockup */

    .mockup-wrap {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .mockup {
      width: min(100%, 470px);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(220,223,229,0.8);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 25px;
      transform: rotate(1deg);
    }

    .mockup-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .mockup-logo {
      font-size: 15px;
      font-weight: 750;
    }

    .mockup-logo span {
      color: #a5aab2;
      font-weight: 500;
    }

    .mockup-date {
      font-size: 12px;
      color: #9aa0aa;
    }

    .mockup-week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 20px;
    }

    .mock-day {
      border: 1px solid #edf0f3;
      border-radius: 10px;
      padding: 10px 2px;
      text-align: center;
      color: #9298a2;
      font-size: 10px;
    }

    .mock-day strong {
      display: block;
      color: #555d69;
      margin-top: 4px;
      font-size: 12px;
    }

    .mock-day.active {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }

    .mock-day.active strong {
      color: white;
    }

    .mock-card {
      height: 92px;
      border: 1px solid #eceef2;
      border-radius: 15px;
      padding: 17px;
      margin-top: 10px;
    }

    .mock-line {
      width: 28%;
      height: 8px;
      background: #dfe2e7;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .mock-line.long {
      width: 62%;
      background: #f0f1f3;
    }

    /* Quote */

    .quote-area {
      width: min(640px, calc(100% - 48px));
      margin: 0 auto 25px;
      position: relative;
      text-align: center;
      min-height: 76px;
      padding: 8px 42px;
      z-index: 2;
    }

    .quote-mark {
      position: absolute;
      font-family: Georgia, serif;
      font-size: 30px;
      color: #c9cdd3;
      line-height: 1;
    }

    .quote-mark.open {
      top: 0;
      left: 10px;
    }

    .quote-mark.close {
      right: 10px;
      bottom: 0;
    }

    .quote-text {
      font-size: 12px;
      color: #8b919a;
      line-height: 1.75;
      font-style: italic;
    }

    .quote-author {
      display: block;
      margin-top: 5px;
      color: #adb1b8;
      font-size: 10px;
      font-style: normal;
    }

    .quote-refresh {
      position: absolute;
      right: -34px;
      top: 50%;
      transform: translateY(-50%);
      width: 27px;
      height: 27px;
      color: #9aa0a9;
      transition: transform 0.25s ease;
    }

    .quote-refresh:hover {
      transform: translateY(-50%) rotate(180deg);
      color: var(--navy);
    }

    .quote-refresh svg {
      width: 17px;
      height: 17px;
    }

    .landing-footer {
      text-align: center;
      padding: 20px 0 26px;
      color: #b1b5bc;
      font-size: 10px;
      position: relative;
      z-index: 2;
    }

    /* =========================
       APP
    ========================= */

    .app-page {
      display: none;
      min-height: 100vh;
      position: relative;
      background:
        radial-gradient(
          circle at 8% 10%,
          rgba(226, 230, 237, 0.35),
          transparent 25%
        ),
        radial-gradient(
          circle at 92% 90%,
          rgba(235, 237, 241, 0.42),
          transparent 28%
        ),
        #fafbfc;
      overflow: hidden;
    }

    .app-page::before {
      content: "FLOW";
      position: fixed;
      left: -100px;
      bottom: 30px;
      font-size: 210px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.08em;
      color: rgba(25, 34, 51, 0.018);
      pointer-events: none;
      user-select: none;
    }

    .app-page::after {
      content: "DAY";
      position: fixed;
      right: -70px;
      top: 110px;
      font-size: 210px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.08em;
      color: rgba(25, 34, 51, 0.016);
      pointer-events: none;
      user-select: none;
    }

    .app-header {
      width: min(1420px, calc(100% - 56px));
      margin: 0 auto;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 5;
    }

    .back-button {
      color: var(--navy);
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      width: 32px;
      text-align: left;
    }

    .back-button:hover {
      transform: translateX(-2px);
    }

    .profile {
      color: #9a9fa8;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-g {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eceef1;
      color: #717782;
      font-size: 9px;
      font-weight: 700;
    }

    .app-content {
      width: min(1240px, calc(100% - 56px));
      margin: 0 auto;
      padding: 30px 0 80px;
      position: relative;
      z-index: 2;
    }

    .date-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 28px;
    }

    .date-title-small {
      color: #9ba0a9;
      font-size: 11px;
      letter-spacing: 0.04em;
      margin-bottom: 7px;
    }

    .date-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-title {
      font-size: clamp(30px, 4vw, 45px);
      line-height: 1;
      font-weight: 780;
      letter-spacing: -0.06em;
    }

    .calendar-button {
      width: 30px;
      height: 30px;
      color: #858b95;
      display: grid;
      place-items: center;
      border-radius: 8px;
      transition: 0.2s ease;
    }

    .calendar-button:hover {
      background: #eef0f3;
      color: var(--navy);
    }

    .calendar-button svg {
      width: 18px;
      height: 18px;
    }

    #datePicker {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .week-range {
      color: #9da2ab;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .week-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .week-nav {
      width: 34px;
      height: 34px;
      border: 1px solid #e5e7eb;
      background: rgba(255,255,255,0.75);
      border-radius: 10px;
      color: #707783;
      font-size: 18px;
      transition: 0.2s ease;
    }

    .week-nav:hover {
      background: white;
      border-color: #d9dce1;
      color: var(--navy);
    }

    /* Week */

    .week-section {
      margin-bottom: 34px;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 9px;
    }

    .day-button {
      min-width: 0;
      height: 82px;
      border: 1px solid #e6e8ec;
      background: rgba(255,255,255,0.72);
      border-radius: 15px;
      color: #9298a2;
      transition: 0.2s ease;
      position: relative;
    }

    .day-button:hover {
      border-color: #d6dae0;
      background: white;
      transform: translateY(-1px);
    }

    .day-button .weekday {
      display: block;
      font-size: 10px;
      margin-bottom: 9px;
    }

    .day-button .day-number {
      display: block;
      font-size: 19px;
      color: #505865;
      font-weight: 600;
    }

    .day-button.today::after {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #a5aab2;
      position: absolute;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
    }

    .day-button.selected {
      background: var(--navy);
      border-color: var(--navy);
      color: #cdd2da;
      box-shadow: 0 9px 20px rgba(23,32,51,0.13);
    }

    .day-button.selected .day-number {
      color: white;
    }

    .day-button.selected.today::after {
      background: white;
    }

    /* Main plans */

    .plans-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }

    .plans-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .plans-count {
      color: #a0a5ae;
      font-size: 10px;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .empty-state {
      grid-column: 1 / -1;
      min-height: 270px;
      border: 1px dashed #dfe2e7;
      border-radius: 20px;
      background: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #a1a6ae;
    }

    .empty-state strong {
      display: block;
      color: #777e88;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .empty-state span {
      font-size: 11px;
    }

    .plan-card {
      background: rgba(255,255,255,0.88);
      border: 1px solid #e8e9ed;
      border-radius: 19px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(30,38,52,0.035);
      transition: 0.2s ease;
    }

    .plan-card:hover {
      box-shadow: 0 13px 35px rgba(30,38,52,0.07);
      transform: translateY(-2px);
    }

    .plan-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 17px;
    }

    .plan-time {
      font-size: 12px;
      font-weight: 700;
      color: #5e6672;
    }

    .delete-plan {
      color: #b2b6bd;
      font-size: 17px;
      line-height: 1;
    }

    .delete-plan:hover {
      color: #747a84;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 19px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 9px 0;
      border-top: 1px solid #f0f1f3;
    }

    .task-check {
      width: 17px;
      height: 17px;
      border: 1px solid #cfd3d9;
      border-radius: 5px;
      appearance: none;
      cursor: pointer;
      position: relative;
      background: white;
    }

    .task-check:checked {
      background: var(--navy);
      border-color: var(--navy);
    }

    .task-check:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }

    .task-check:checked + .task-name {
      color: #b0b4bb;
      text-decoration: line-through;
    }

    .task-name {
      min-width: 0;
      font-size: 12px;
      color: #606874;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-duration {
      color: #a4a9b1;
      font-size: 10px;
      white-space: nowrap;
    }

    .add-plan-button {
      position: fixed;
      right: 34px;
      bottom: 30px;
      width: 50px;
      height: 50px;
      border-radius: 15px;
      background: var(--navy);
      color: white;
      font-size: 27px;
      font-weight: 250;
      box-shadow: 0 12px 30px rgba(23,32,51,0.18);
      z-index: 10;
      transition: 0.2s ease;
    }

    .add-plan-button:hover {
      transform: translateY(-3px);
    }

    .app-footer {
      text-align: center;
      color: #b2b6bd;
      font-size: 9px;
      padding: 35px 0 10px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.28);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      width: min(530px, 100%);
      background: white;
      border-radius: 24px;
      padding: 27px;
      box-shadow: 0 25px 70px rgba(10,16,28,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .close-modal {
      font-size: 22px;
      color: #a2a7af;
    }

    .form-label {
      display: block;
      font-size: 11px;
      color: #888f99;
      margin-bottom: 8px;
    }

    .time-inputs {
      display: grid;
      grid-template-columns: 1fr 20px 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
    }

    .input-field {
      width: 100%;
      height: 46px;
      border: 1px solid #e3e5e9;
      border-radius: 11px;
      padding: 0 13px;
      outline: none;
      color: #4f5661;
      background: #fafbfc;
      font-size: 12px;
    }

    .input-field:focus {
      border-color: #bfc4cc;
      background: white;
    }

    .time-separator {
      text-align: center;
      color: #a1a6ae;
    }

    .tasks-editor {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 12px;
    }

    .editor-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 100px 30px;
      gap: 7px;
      align-items: center;
    }

    .editor-row .input-field {
      height: 43px;
    }

    .duration-input {
      text-align: center;
    }

    .remove-task {
      height: 43px;
      color: #a3a8b0;
      font-size: 18px;
    }

    .add-task {
      width: 100%;
      height: 42px;
      border: 1px dashed #d9dce1;
      border-radius: 10px;
      color: #8f959e;
      font-size: 11px;
    }

    .add-task:hover {
      border-color: #c6cad1;
      color: #666d78;
    }

    .save-plan {
      width: 100%;
      height: 49px;
      background: var(--navy);
      color: white;
      border-radius: 12px;
      margin-top: 22px;
      font-size: 13px;
      font-weight: 650;
    }

    /* Delete confirmation */

    .confirm-modal {
      width: min(360px, 100%);
      background: white;
      border-radius: 21px;
      padding: 27px;
      box-shadow: 0 25px 70px rgba(10,16,28,0.2);
      text-align: center;
    }

    .confirm-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .confirm-description {
      font-size: 11px;
      color: #9a9fa7;
      margin-bottom: 22px;
    }

    .confirm-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .confirm-buttons button {
      height: 43px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .confirm-yes {
      background: var(--navy);
      color: white;
    }

    .confirm-no {
      background: #f1f2f4;
      color: #656c76;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {
      .landing-main {
        grid-template-columns: 1fr;
        gap: 45px;
        text-align: center;
      }

      .hero-copy {
        padding-left: 0;
      }

      .mockup-wrap {
        order: 2;
      }

      .landing-main {
        padding-top: 35px;
      }

      .plans {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .landing-header,
      .landing-main {
        width: min(100% - 32px, 1280px);
      }

      .landing-header {
        padding-top: 21px;
      }

      .landing-main {
        padding-top: 35px;
        padding-bottom: 35px;
      }

      .hero-title {
        font-size: clamp(43px, 13vw, 60px);
      }

      .hero-description {
        font-size: 13px;
      }

      .mockup {
        padding: 17px;
        border-radius: 21px;
      }

      .quote-area {
        width: calc(100% - 65px);
      }

      .quote-refresh {
        right: -31px;
      }

      .landing-page::before,
      .landing-page::after,
      .app-page::before,
      .app-page::after {
        display: none;
      }

      .app-header {
        width: calc(100% - 32px);
        height: 65px;
      }

      .app-content {
        width: calc(100% - 32px);
        padding-top: 23px;
      }

      .date-heading {
        align-items: flex-start;

    @media (max-width: 400px) {

      .day-button .weekday {

  </style>
</head>

<body>

  <!-- =========================
       LANDING PAGE

    </button>

  <!-- =========================
       ADD PLAN MODAL
  ========================= -->

  <div class="modal-backdrop" id="planModal">

    <div class="modal">

      <div class="modal-header">
        <h2 class="modal-title">새 계획</h2>

      <label class="form-label">시간</label>

        <input
          type="time"

          step="600"

          type="time"

  </div>


  <!-- =========================
       DELETE CONFIRM MODAL
  ========================= -->

  <div class="modal-backdrop" id="deleteModal">

    <div class="confirm-modal">

      <div class="confirm-title">
        계획을 삭제하시겠습니까?
      </div>

      <div class="confirm-description">
        삭제한 계획은 다시 복구할 수 없습니다.
      </div>

      <div class="confirm-buttons">

        <!-- 예가 먼저 -->
        <button class="confirm-yes" id="confirmDelete">
          예
        </button>

        <button class="confirm-no" id="cancelDelete">
          아니오
        </button>

      </div>

    </div>

  </div>


  <script>
    /* =========================
       DATA
    ========================= */

    const quotes = [
      {
        text: "천재는 1%의 영감과 99%의 땀으로 이루어진다.",
        author: "토머스 에디슨"
      },
      {
        text: "교육은 세상을 바꾸는 데 사용할 수 있는 가장 강력한 무기다.",
        author: "넬슨 만델라"
      },
      {
        text: "교육의 뿌리는 쓰지만, 그 열매는 달다.",
        author: "아리스토텔레스"
      },
      {
        text: "배움은 정신을 결코 지치게 하지 않는다.",
        author: "레오나르도 다 빈치"
      },
      {
        text: "어떤 분야의 전문가도 한때는 초보자였다.",
        author: "헬렌 헤이스"
      },
      {
        text: "읽지 마라, 반박하고 논박하기 위해서도, 무조건 믿기 위해서도 아니다. 숙고하고 판단하기 위해 읽어라.",
        author: "프랜시스 베이컨"
      },
      {
        text: "교육은 미래로 가는 우리의 여권이다.",
        author: "말콤 엑스"
      },
      {
        text: "오직 하나의 선은 지식이고, 오직 하나의 악은 무지다.",
        author: "소크라테스"
      }
    ];

    const STORAGE_KEY = "flowday_plans_v4";

    let plans = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    let selectedDate = new Date();
    selectedDate.setHours(0, 0, 0, 0);

    let weekStart = getMonday(selectedDate);

    let deleteTargetId = null;


    /* =========================
       ELEMENTS
    ========================= */

    const landingPage = document.getElementById("landingPage");
    const appPage = document.getElementById("appPage");

    const startButton = document.getElementById("startButton");
    const googleButton = document.getElementById("googleButton");
    const backButton = document.getElementById("backButton");

    const dateTitle = document.getElementById("dateTitle");
    const weekRange = document.getElementById("weekRange");
    const weekGrid = document.getElementById("weekGrid");

    const prevWeek = document.getElementById("prevWeek");
    const nextWeek = document.getElementById("nextWeek");

    const calendarButton = document.getElementById("calendarButton");
    const datePicker = document.getElementById("datePicker");

    const plansContainer = document.getElementById("plansContainer");
    const plansCount = document.getElementById("plansCount");

    const addPlanButton = document.getElementById("addPlanButton");

    const planModal = document.getElementById("planModal");
    const closePlanModal = document.getElementById("closePlanModal");

    const startTime = document.getElementById("startTime");
    const endTime = document.getElementById("endTime");

    const tasksEditor = document.getElementById("tasksEditor");
    const addTaskButton = document.getElementById("addTaskButton");
    const savePlanButton = document.getElementById("savePlanButton");

    const deleteModal = document.getElementById("deleteModal");
    const confirmDelete = document.getElementById("confirmDelete");
    const cancelDelete = document.getElementById("cancelDelete");

    const quoteText = document.getElementById("quoteText");
    const quoteAuthor = document.getElementById("quoteAuthor");
    const quoteRefresh = document.getElementById("quoteRefresh");


    /* =========================
       LANDING
    ========================= */

    function showApp() {
      landingPage.style.display = "none";
      appPage.style.display = "block";
      renderApp();
    }

    function showLanding() {
      appPage.style.display = "none";
      landingPage.style.display = "flex";
    }

    startButton.addEventListener("click", showApp);

    /*
      Google 버튼은 현재 데모 진입 버튼.
      Firebase 연결 후 이 부분만 실제 Google 로그인으로 교체하면 됨.
    */
    googleButton.addEventListener("click", showApp);

    backButton.addEventListener("click", showLanding);


    /* =========================
       QUOTES
    ========================= */

    let quoteIndex = Math.floor(Math.random() * quotes.length);

    function renderQuote() {
      const quote = quotes[quoteIndex];

      quoteText.textContent = quote.text;
      quoteAuthor.textContent = `· ${quote.author}`;
    }

    quoteRefresh.addEventListener("click", () => {
      quoteIndex = (quoteIndex + 1) % quotes.length;
      renderQuote();
    });

    renderQuote();


    /* =========================
       DATE FUNCTIONS
    ========================= */

    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");

      return `${y}-${m}-${d}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = key.split("-").map(Number);

      const date = new Date(y, m - 1, d);
      date.setHours(0, 0, 0, 0);

      return date;
    }

    function getMonday(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);

      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;

      d.setDate(d.getDate() + diff);

      return d;
    }

    function addDays(date, amount) {
      const d = new Date(date);
      d.setDate(d.getDate() + amount);
      return d;
    }

    function isSameDate(a, b) {
      return dateKey(a) === dateKey(b);
    }

    function formatDateTitle(date) {
      return `${date.getMonth() + 1}월 ${date.getDate()}일`;
    }

    function formatShortDate(date) {
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function formatWeekRange(start) {
      const end = addDays(start, 6);

      return `${start.getMonth() + 1}월 ${start.getDate()}일 - ${end.getMonth() + 1}월 ${end.getDate()}일`;
    }

    function getWeekday(date) {
      const names = ["일", "월", "화", "수", "목", "금", "토"];
      return names[date.getDay()];
    }


    /* =========================
       WEEK RENDER
    ========================= */

    function renderWeek() {
      weekGrid.innerHTML = "";

      weekRange.textContent = formatWeekRange(weekStart);

      for (let i = 0; i < 7; i++) {

        const date = addDays(weekStart, i);

        const button = document.createElement("button");
        button.className = "day-button";

        if (isSameDate(date, selectedDate)) {
          button.classList.add("selected");
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        if (isSameDate(date, today)) {
          button.classList.add("today");
        }

        button.innerHTML = `
          <span class="weekday">${getWeekday(date)}</span>
          <span class="day-number">${date.getDate()}</span>
        `;

        button.addEventListener("click", () => {
          selectedDate = new Date(date);
          renderApp();
        });

        weekGrid.appendChild(button);
      }
    }


    /* =========================
       PLAN RENDER
    ========================= */

    function getPlansForDate(date) {
      const key = dateKey(date);

      return plans
        .filter(plan => plan.date === key)
        .sort((a, b) => a.startTime.localeCompare(b.startTime));
    }

    function renderPlans() {

      const todayPlans = getPlansForDate(selectedDate);

      plansContainer.innerHTML = "";

      plansCount.textContent =
        todayPlans.length === 0
          ? ""
          : `${todayPlans.length}개의 계획`;

      if (todayPlans.length === 0) {

        plansContainer.innerHTML = `
          <div class="empty-state">
            <div>
              <strong>오늘의 계획이 없습니다.</strong>
              <span>오른쪽 아래 + 버튼으로 새로운 계획을 추가해보세요.</span>
            </div>
          </div>
        `;

        return;
      }

      todayPlans.forEach(plan => {

        const card = document.createElement("article");
        card.className = "plan-card";

        const taskHTML = plan.tasks.map((task, index) => {

          return `
            <div class="task-row">
              <input
                type="checkbox"
                class="task-check"
                data-plan-id="${plan.id}"
                data-task-index="${index}"
                ${task.done ? "checked" : ""}
              >

              <span class="task-name">${escapeHTML(task.name)}</span>

              <span class="task-duration">
                ${task.duration}분
              </span>
            </div>
          `;

        }).join("");

        card.innerHTML = `
          <div class="plan-top">

            <div class="plan-time">
              ${plan.startTime} ~ ${plan.endTime}
            </div>

            <button
              class="delete-plan"
              data-delete-id="${plan.id}"
              aria-label="계획 삭제"
            >
              ×
            </button>

          </div>

          <div class="task-list">
            ${taskHTML}
          </div>
        `;

        plansContainer.appendChild(card);
      });

      document.querySelectorAll(".delete-plan").forEach(button => {

        button.addEventListener("click", () => {

          deleteTargetId = Number(button.dataset.deleteId);

          deleteModal.classList.add("show");
        });

      });

      document.querySelectorAll(".task-check").forEach(check => {

        check.addEventListener("change", () => {

          const id = Number(check.dataset.planId);
          const taskIndex = Number(check.dataset.taskIndex);

          const plan = plans.find(item => item.id === id);

          if (!plan) return;

          plan.tasks[taskIndex].done = check.checked;

          savePlans();

        });

      });
    }


    function renderApp() {

      dateTitle.textContent = formatDateTitle(selectedDate);

      datePicker.value = dateKey(selectedDate);

      renderWeek();
      renderPlans();
    }


    /* =========================
       WEEK NAVIGATION
    ========================= */

    prevWeek.addEventListener("click", () => {

      weekStart = addDays(weekStart, -7);

      selectedDate = new Date(weekStart);

      renderApp();
    });

    nextWeek.addEventListener("click", () => {

      weekStart = addDays(weekStart, 7);

      selectedDate = new Date(weekStart);

      renderApp();
    });


    /* =========================
       DATE PICKER
    ========================= */

    calendarButton.addEventListener("click", () => {

      try {
        if (datePicker.showPicker) {
          datePicker.showPicker();
        } else {
          datePicker.click();
        }
      } catch {
        datePicker.click();
      }

    });

    datePicker.addEventListener("change", () => {

      if (!datePicker.value) return;

      selectedDate = parseDateKey(datePicker.value);

      weekStart = getMonday(selectedDate);

      renderApp();
    });


    /* =========================
       MODAL
    ========================= */

    function openPlanModal() {

      startTime.value = "10:00";
      endTime.value = "11:00";

      tasksEditor.innerHTML = "";

      addTaskEditorRow();

      planModal.classList.add("show");
    }

    function closeModal() {
      planModal.classList.remove("show");
    }

    addPlanButton.addEventListener("click", openPlanModal);

    closePlanModal.addEventListener("click", closeModal);

    planModal.addEventListener("click", event => {

      if (event.target === planModal) {
        closeModal();
      }

    });


    /* =========================
       TASK EDITOR
    ========================= */

    function normalizeDuration(value) {

      let number = Number(value);

      if (!Number.isFinite(number) || number < 10) {
        return 10;
      }

      number = Math.round(number / 10) * 10;

      return Math.max(10, number);
    }

    function addTaskEditorRow(name = "", duration = 30) {

      const row = document.createElement("div");

      row.className = "editor-row";

      row.innerHTML = `
        <input
          type="text"
          class="input-field task-input"
          placeholder="할 일을 추가하세요"
          value="${escapeAttribute(name)}"
        >

        <input
          type="number"
          class="input-field duration-input"
          min="10"
          step="10"
          value="${normalizeDuration(duration)}"
          aria-label="소요 시간"
        >

        <button
          class="remove-task"
          type="button"
          aria-label="할 일 삭제"
        >
          ×
        </button>
      `;

      row.querySelector(".remove-task").addEventListener("click", () => {

        if (tasksEditor.children.length === 1) {
          return;
        }

        row.remove();
      });

      row.querySelector(".duration-input").addEventListener("blur", event => {
        event.target.value = normalizeDuration(event.target.value);
      });

      tasksEditor.appendChild(row);
    }

    addTaskButton.addEventListener("click", () => {
      addTaskEditorRow();
    });


    /* =========================
       SAVE PLAN
    ========================= */

    savePlanButton.addEventListener("click", () => {

      const start = normalizeTime(startTime.value);
      const end = normalizeTime(endTime.value);

      if (!start || !end) {
        alert("시간을 입력해주세요.");
        return;
      }

      if (start >= end) {
        alert("종료 시간은 시작 시간보다 늦어야 합니다.");
        return;
      }

      const rows = [...tasksEditor.querySelectorAll(".editor-row")];

      const taskData = rows
        .map(row => {

          const name =
            row.querySelector(".task-input").value.trim();

          const duration =
            normalizeDuration(
              row.querySelector(".duration-input").value
            );

          return {
            name,
            duration,
            done: false
          };

        })
        .filter(task => task.name !== "");

      if (taskData.length === 0) {
        alert("할 일을 하나 이상 입력해주세요.");
        return;
      }

      const newPlan = {
        id: Date.now(),
        date: dateKey(selectedDate),
        startTime: start,
        endTime: end,
        tasks: taskData
      };

      plans.push(newPlan);

      savePlans();

      closeModal();

      renderPlans();
    });


    /* =========================
       DELETE
    ========================= */

    confirmDelete.addEventListener("click", () => {

      if (deleteTargetId === null) return;

      plans = plans.filter(plan => plan.id !== deleteTargetId);

      savePlans();

      deleteTargetId = null;

      deleteModal.classList.remove("show");

      renderPlans();
    });

    cancelDelete.addEventListener("click", () => {

      deleteTargetId = null;

      deleteModal.classList.remove("show");
    });

    deleteModal.addEventListener("click", event => {

      if (event.target === deleteModal) {
        deleteTargetId = null;
        deleteModal.classList.remove("show");
      }

    });


    /* =========================
       STORAGE
    ========================= */

    function savePlans() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(plans)
      );

    }


    /* =========================
       HELPERS
    ========================= */

    function normalizeTime(value) {

      if (!value) return "";

      const [hour, minute] = value.split(":").map(Number);

      if (
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
      ) {
        return "";
      }

      const totalMinutes =
        hour * 60 +
        Math.round(minute / 10) * 10;

      const normalizedHour =
        Math.floor(totalMinutes / 60) % 24;

      const normalizedMinute =
        totalMinutes % 60;

      return `${String(normalizedHour).padStart(2, "0")}:${String(normalizedMinute).padStart(2, "0")}`;
    }

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHTML(value);
    }


    /* =========================
