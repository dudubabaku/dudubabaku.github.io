<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flowday</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #172033;
      --text: #1d2430;
      --muted: #858c97;
      --light-muted: #a4a9b1;
      --line: #e5e7eb;
      --soft: #f7f8fa;
      --white: #ffffff;
      --shadow: 0 20px 55px rgba(20, 28, 43, 0.09);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background: #fafbfc;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    /* =====================================
       LANDING
    ===================================== */

    .landing-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 12% 20%,
          rgba(225, 229, 237, 0.42),
          transparent 30%
        ),
        radial-gradient(
          circle at 88% 78%,
          rgba(235, 237, 241, 0.52),
          transparent 32%
        ),
        #fbfbfc;
    }

    .landing-page::before {
      content: "FLOW";
      position: absolute;
      left: -60px;
      bottom: 60px;
      font-size: clamp(120px, 18vw, 260px);
      font-weight: 800;
      letter-spacing: -0.08em;
      color: rgba(25, 34, 51, 0.025);
      pointer-events: none;
      user-select: none;
    }

    .landing-page::after {
      content: "DAY";
      position: absolute;
      right: -40px;
      top: 19%;
      font-size: clamp(120px, 18vw, 260px);
      font-weight: 800;
      letter-spacing: -0.08em;
      color: rgba(25, 34, 51, 0.02);
      pointer-events: none;
      user-select: none;
    }

    .landing-header {
      width: min(1320px, calc(100% - 56px));
      margin: 0 auto;
      padding: 30px 0;
      position: relative;
      z-index: 5;
    }

    .logo {
      font-size: 25px;
      line-height: 1;
      font-weight: 780;
      letter-spacing: -0.06em;
    }

    .logo .day {
      color: #a2a7af;
      font-weight: 500;
    }

    .landing-main {
      width: min(1320px, calc(100% - 56px));
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(440px, 0.88fr);
      gap: 90px;
      align-items: center;
      padding: 35px 0 55px;
      position: relative;
      z-index: 2;
    }

    .hero-copy {
      padding-left: clamp(0px, 3vw, 55px);
    }

    .eyebrow {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #969ca6;
      margin-bottom: 22px;
    }

    .hero-title {
      font-size: clamp(55px, 6.2vw, 86px);
      line-height: 1.05;
      letter-spacing: -0.07em;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .hero-description {
      color: #737b86;
      line-height: 1.9;
      font-size: 17px;
      margin-bottom: 38px;
    }

    .start-button,
    .google-button {
      width: 285px;
    }

    .start-button {
      height: 60px;
      background: var(--navy);
      color: white;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 680;
      box-shadow: 0 11px 28px rgba(23, 32, 51, 0.15);
      transition: 0.2s ease;
    }

    .start-button:hover {
      transform: translateY(-2px);
      background: #111827;
      box-shadow: 0 15px 32px rgba(23, 32, 51, 0.19);
    }

    .google-button {
      margin-top: 12px;
      height: 56px;
      border: 1px solid #e0e3e8;
      background: rgba(255,255,255,0.82);
      border-radius: 14px;
      color: #555d68;
      font-size: 14px;
      font-weight: 550;
      transition: 0.2s ease;
    }

    .google-button:hover {
      background: white;
      border-color: #d1d5db;
    }

    .google-icon {
      font-size: 17px;
      font-weight: 750;
      margin-right: 8px;
    }

    /* =====================================
       LANDING MOCKUP
    ===================================== */

    .mockup-wrap {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .mockup {
      width: min(100%, 550px);
      background: rgba(255,255,255,0.93);
      border: 1px solid rgba(220,223,229,0.85);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 31px;
      transform: rotate(1deg);
    }

    .mockup-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 27px;
    }

    .mockup-logo {
      font-size: 18px;
      font-weight: 760;
      letter-spacing: -0.05em;
    }

    .mockup-logo span {
      color: #a5aab2;
      font-weight: 500;
    }

    .mockup-date {
      font-size: 13px;
      color: #9299a3;
    }

    .mockup-week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      margin-bottom: 22px;
    }

    .mock-day {
      border: 1px solid #e9ebef;
      border-radius: 12px;
      padding: 13px 3px 14px;
      text-align: center;
      color: #8c939d;
      font-size: 12px;
    }

    .mock-day strong {
      display: block;
      color: #555d69;
      margin-top: 7px;
      font-size: 21px;
      line-height: 1;
      font-weight: 650;
    }

    .mock-day.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #d8dce2;
    }

    .mock-day.active strong {
      color: white;
    }

    .mock-card {
      height: 110px;
      border: 1px solid #e8eaee;
      border-radius: 17px;
      padding: 20px;
      margin-top: 11px;
    }

    .mock-line {
      width: 27%;
      height: 9px;
      background: #dfe2e7;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .mock-line.long {
      width: 64%;
      background: #eef0f3;
    }

    /* =====================================
       QUOTE
    ===================================== */

    .quote-area {
      width: min(780px, calc(100% - 80px));
      margin: 0 auto 28px;
      position: relative;
      text-align: center;
      min-height: 92px;
      padding: 9px 55px;
      z-index: 3;
    }

    .quote-mark {
      position: absolute;
      font-family: Georgia, serif;
      font-size: 38px;
      color: #c7cbd1;
      line-height: 1;
    }

    .quote-mark.open {
      top: 0;
      left: 12px;
    }

    .quote-mark.close {
      right: 12px;
      bottom: 0;
    }

    .quote-text-ko {
      font-size: 15px;
      line-height: 1.8;
      color: #737a84;
      font-style: italic;
    }

    .quote-text-en {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.6;
      color: #a0a5ad;
      font-style: italic;
    }

    .quote-author {
      display: block;
      margin-top: 7px;
      color: #aeb2b9;
      font-size: 11px;
      font-style: normal;
    }

    .quote-refresh {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 31px;
      height: 31px;
      color: #969ca5;
      transition: 0.25s ease;
    }

    .quote-refresh:hover {
      transform: translateY(-50%) rotate(180deg);
      color: var(--navy);
    }

    .quote-refresh svg {
      width: 19px;
      height: 19px;
    }

    .landing-footer {
      text-align: center;
      padding: 18px 0 28px;
      color: #adb2ba;
      font-size: 11px;
      position: relative;
      z-index: 3;
    }

    /* =====================================
       APP
    ===================================== */

    .app-page {
      display: none;
      min-height: 100vh;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 8% 10%,
          rgba(226, 230, 237, 0.34),
          transparent 25%
        ),
        radial-gradient(
          circle at 92% 90%,
          rgba(235, 237, 241, 0.4),
          transparent 28%
        ),
        #fafbfc;
    }

    .app-page::before {
      content: "FLOW";
      position: fixed;
      left: -105px;
      bottom: 30px;
      font-size: 220px;
      font-weight: 800;
      letter-spacing: -0.08em;
      color: rgba(25, 34, 51, 0.018);
      pointer-events: none;
    }

    .app-page::after {
      content: "DAY";
      position: fixed;
      right: -75px;
      top: 105px;
      font-size: 220px;
      font-weight: 800;
      letter-spacing: -0.08em;
      color: rgba(25, 34, 51, 0.016);
      pointer-events: none;
    }

    .app-header {
      width: min(1420px, calc(100% - 56px));
      height: 82px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    /* 진짜 90도 쉐브론 */
    .back-button {
      width: 30px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      color: var(--navy);
    }

    .back-button svg {
      width: 22px;
      height: 27px;
    }

    .profile {
      color: #9298a2;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .profile-g {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eceef1;
      color: #707782;
      font-size: 10px;
      font-weight: 700;
    }

    .app-content {
      width: min(1280px, calc(100% - 56px));
      margin: 0 auto;
      padding: 32px 0 80px;
      position: relative;
      z-index: 3;
    }

    .date-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 30px;
    }

    .date-title-small {
      color: #969ca6;
      font-size: 13px;
      font-weight: 550;
      letter-spacing: 0.05em;
      margin-bottom: 9px;
    }

    .date-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-title {
      font-size: clamp(38px, 4vw, 52px);
      line-height: 1;
      font-weight: 790;
      letter-spacing: -0.065em;
    }

    .calendar-button {
      width: 35px;
      height: 35px;
      color: #7e858f;
      display: grid;
      place-items: center;
      border-radius: 9px;
      position: relative;
      overflow: hidden;
      transition: 0.2s ease;
    }

    .calendar-button:hover {
      background: #eef0f3;
      color: var(--navy);
    }

    .calendar-button svg {
      width: 21px;
      height: 21px;
      pointer-events: none;
    }

    /*
      input 자체가 버튼 전체를 덮도록 함.
      모바일 Safari에서도 직접 터치하면
      네이티브 날짜 선택창이 열림.
    */
    #datePicker {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .week-range {
      color: #9298a2;
      font-size: 13px;
      margin-bottom: 9px;
      text-align: right;
    }

    .week-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .week-nav {
      width: 38px;
      height: 38px;
      border: 1px solid #e2e5e9;
      background: rgba(255,255,255,0.8);
      border-radius: 11px;
      color: #6e7681;
      font-size: 22px;
      line-height: 1;
      transition: 0.2s ease;
    }

    .week-nav:hover {
      background: white;
      border-color: #d4d8de;
      color: var(--navy);
    }

    /* =====================================
       WEEK
    ===================================== */

    .week-section {
      margin-bottom: 39px;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 11px;
    }

    .day-button {
      min-width: 0;
      height: 94px;
      border: 1px solid #e3e6ea;
      background: rgba(255,255,255,0.76);
      border-radius: 17px;
      color: #9298a2;
      transition: 0.2s ease;
      position: relative;
    }

    .day-button:hover {
      border-color: #d4d8de;
      background: white;
      transform: translateY(-1px);
    }

    .day-button .weekday {
      display: block;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .day-button .day-number {
      display: block;
      font-size: 24px;
      line-height: 1;
      color: #4d5663;
      font-weight: 650;
    }

    .day-button.today::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #a2a8b0;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .day-button.selected {
      background: var(--navy);
      border-color: var(--navy);
      color: #d2d6dd;
      box-shadow: 0 10px 24px rgba(23,32,51,0.14);
    }

    .day-button.selected .day-number {
      color: white;
    }

    .day-button.selected.today::after {
      background: white;
    }

    /* =====================================
       PLANS
    ===================================== */

    .plans-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .plans-title {
      font-size: 19px;
      font-weight: 720;
      letter-spacing: -0.04em;
    }

    .plans-count {
      color: #999fa8;
      font-size: 12px;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .empty-state {
      grid-column: 1 / -1;
      min-height: 320px;
      border: 1px dashed #dce0e5;
      border-radius: 22px;
      background: rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #989ea7;
    }

    .empty-state strong {
      display: block;
      color: #747c87;
      font-size: 17px;
      margin-bottom: 10px;
      font-weight: 650;
    }

    .empty-state span {
      font-size: 13px;
      line-height: 1.7;
    }

    .plan-card {
      background: rgba(255,255,255,0.9);
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 9px 27px rgba(30,38,52,0.04);
      transition: 0.2s ease;
    }

    .plan-card:hover {
      box-shadow: 0 15px 36px rgba(30,38,52,0.07);
      transform: translateY(-2px);
    }

    .plan-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
    }

    .plan-name {
      font-size: 16px;
      font-weight: 720;
      color: #3f4753;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
    }

    .plan-time {
      font-size: 13px;
      font-weight: 650;
      color: #68717d;
    }

    .delete-plan {
      color: #aeb3bb;
      font-size: 21px;
      line-height: 1;
      flex-shrink: 0;
    }

    .delete-plan:hover {
      color: #6e7580;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid #eff0f2;
    }

    .task-check {
      width: 18px;
      height: 18px;
      border: 1px solid #cdd2d9;
      border-radius: 5px;
      appearance: none;
      cursor: pointer;
      position: relative;
      background: white;
    }

    .task-check:checked {
      background: var(--navy);
      border-color: var(--navy);
    }

    .task-check:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }

    .task-check:checked + .task-name {
      color: #aeb3ba;
      text-decoration: line-through;
    }

    .task-name {
      min-width: 0;
      font-size: 13px;
      color: #606874;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-duration {
      color: #9ba1aa;
      font-size: 11px;
      white-space: nowrap;
    }

    .add-plan-button {
      position: fixed;
      right: 35px;
      bottom: 31px;
      width: 55px;
      height: 55px;
      border-radius: 16px;
      background: var(--navy);
      color: white;
      font-size: 30px;
      font-weight: 250;
      box-shadow: 0 13px 32px rgba(23,32,51,0.19);
      z-index: 20;
      transition: 0.2s ease;
    }

    .add-plan-button:hover {
      transform: translateY(-3px);
    }

    .app-footer {
      text-align: center;
      color: #adb2ba;
      font-size: 11px;
      padding: 42px 0 10px;
    }

    /* =====================================
       MODAL
    ===================================== */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,0.28);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      width: min(550px, 100%);
      background: white;
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(10,16,28,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .modal-title {
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .close-modal {
      font-size: 25px;
      color: #a2a7af;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #858c96;
      margin-bottom: 9px;
      font-weight: 550;
    }

    .input-field {
      width: 100%;
      height: 48px;
      border: 1px solid #e1e4e8;
      border-radius: 11px;
      padding: 0 14px;
      outline: none;
      color: #4e5662;
      background: #fafbfc;
      font-size: 13px;
    }

    .input-field:focus {
      border-color: #bfc4cc;
      background: white;
    }

    .plan-name-input {
      margin-bottom: 23px;
    }

    .time-inputs {
      display: grid;
      grid-template-columns: 1fr 25px 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 23px;
    }

    .time-separator {
      text-align: center;
      color: #9ca2aa;
      font-size: 13px;
    }

    .tasks-editor {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 12px;
    }

    .editor-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) 105px 32px;
      gap: 8px;
      align-items: center;
    }

    .editor-row .input-field {
      height: 46px;
    }

    .duration-input {
      text-align: center;
    }

    .remove-task {
      height: 46px;
      color: #a3a8b0;
      font-size: 20px;
    }

    .add-task {
      width: 100%;
      height: 45px;
      border: 1px dashed #d7dbe0;
      border-radius: 11px;
      color: #888f99;
      font-size: 12px;
    }

    .add-task:hover {
      border-color: #c5c9d0;
      color: #646c77;
    }

    .save-plan {
      width: 100%;
      height: 52px;
      background: var(--navy);
      color: white;
      border-radius: 13px;
      margin-top: 23px;
      font-size: 14px;
      font-weight: 650;
    }

    /* =====================================
       DELETE CONFIRM
    ===================================== */

    .confirm-modal {
      width: min(390px, 100%);
      background: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(10,16,28,0.2);
      text-align: center;
    }

    .confirm-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .confirm-description {
      font-size: 12px;
      color: #969ca5;
      margin-bottom: 23px;
    }

    .confirm-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .confirm-buttons button {
      height: 46px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 620;
    }

    .confirm-yes {
      background: var(--navy);
      color: white;
    }

    .confirm-no {
      background: #f1f2f4;
      color: #656c76;
    }

    /* =====================================
       RESPONSIVE
    ===================================== */

    @media (max-width: 1050px) {

      .landing-main {

  <script>

    /* =====================================
       QUOTES
    ===================================== */

    const quotes = [

      {
        ko: "천재는 1%의 영감과 99%의 땀으로 이루어진다.",
        en: "Genius is one percent inspiration, ninety-nine percent perspiration.",
        author: "토머스 에디슨"
      },

      {
        ko: "교육은 세상을 바꾸는 데 사용할 수 있는 가장 강력한 무기다.",
        en: "Education is the most powerful weapon which you can use to change the world.",
        author: "넬슨 만델라"
      },

      {
        ko: "교육의 뿌리는 쓰지만, 그 열매는 달다.",
        en: "The roots of education are bitter, but the fruit is sweet.",
        author: "아리스토텔레스"
      },

      {
        ko: "배움은 정신을 결코 지치게 하지 않는다.",
        en: "Learning never exhausts the mind.",
        author: "레오나르도 다 빈치"
      },

      {
        ko: "어떤 분야의 전문가도 한때는 초보자였다.",
        en: "The expert in anything was once a beginner.",
        author: "헬렌 헤이스"
      },

      {
        ko: "읽고, 생각하고, 판단하라.",
        en: "Read, think, and consider.",
        author: "프랜시스 베이컨"
      },

      {
        ko: "교육은 미래로 가는 우리의 여권이다.",
        en: "Education is our passport to the future.",
        author: "말콤 엑스"
      },

      {
        ko: "오직 하나의 선은 지식이고, 오직 하나의 악은 무지다.",
        en: "The only good is knowledge, and the only evil is ignorance.",
        author: "소크라테스"
      }

    ];


    const STORAGE_KEY = "flowday_plans_v4";

    let plans =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );


    let selectedDate = new Date();

    selectedDate.setHours(0, 0, 0, 0);


    let weekStart =
      getMonday(selectedDate);


    let deleteTargetId = null;


    /* =====================================
       ELEMENTS
    ===================================== */

    const landingPage =
      document.getElementById("landingPage");

    const appPage =
      document.getElementById("appPage");

    const startButton =
      document.getElementById("startButton");

    const googleButton =
      document.getElementById("googleButton");

    const backButton =
      document.getElementById("backButton");

    const dateTitle =
      document.getElementById("dateTitle");

    const weekRange =
      document.getElementById("weekRange");

    const weekGrid =
      document.getElementById("weekGrid");

    const prevWeek =
      document.getElementById("prevWeek");

    const nextWeek =
      document.getElementById("nextWeek");

    const datePicker =
      document.getElementById("datePicker");

    const plansContainer =
      document.getElementById("plansContainer");

    const plansCount =
      document.getElementById("plansCount");

    const addPlanButton =
      document.getElementById("addPlanButton");

    const planModal =
      document.getElementById("planModal");

    const closePlanModal =
      document.getElementById("closePlanModal");

    const planName =
      document.getElementById("planName");

    const startTime =
      document.getElementById("startTime");

    const endTime =
      document.getElementById("endTime");

    const tasksEditor =
      document.getElementById("tasksEditor");

    const addTaskButton =
      document.getElementById("addTaskButton");

    const savePlanButton =
      document.getElementById("savePlanButton");

    const deleteModal =
      document.getElementById("deleteModal");

    const confirmDelete =
      document.getElementById("confirmDelete");

    const cancelDelete =
      document.getElementById("cancelDelete");

    const quoteTextKo =
      document.getElementById("quoteTextKo");

    const quoteTextEn =
      document.getElementById("quoteTextEn");

    const quoteAuthor =
      document.getElementById("quoteAuthor");

    const quoteRefresh =
      document.getElementById("quoteRefresh");


    /* =====================================
       LANDING
    ===================================== */

    function showApp() {

      landingPage.style.display = "none";
      appPage.style.display = "block";

      renderApp();
    }


    function showLanding() {

      appPage.style.display = "none";
      landingPage.style.display = "flex";
    }


    startButton.addEventListener(
      "click",
      showApp
    );


    googleButton.addEventListener(
      "click",
      showApp
    );


    backButton.addEventListener(
      "click",
      showLanding
    );


    /* =====================================
       QUOTES
    ===================================== */

    let quoteIndex =
      Math.floor(
        Math.random() * quotes.length
      );


    function renderQuote() {

      const quote =
        quotes[quoteIndex];

      quoteTextKo.textContent =
        quote.ko;

      quoteTextEn.textContent =
        quote.en;

      quoteAuthor.textContent =
        `· ${quote.author}`;
    }


    quoteRefresh.addEventListener(
      "click",
      () => {

        quoteIndex =
          (quoteIndex + 1) %
          quotes.length;

        renderQuote();

      }
    );


    renderQuote();


    /* =====================================
       DATE
    ===================================== */

    function dateKey(date) {

      const y =
        date.getFullYear();

      const m =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const d =
        String(
          date.getDate()
        ).padStart(2, "0");

      return `${y}-${m}-${d}`;
    }


    function parseDateKey(key) {

      const [y, m, d] =
        key.split("-").map(Number);

      const date =
        new Date(
          y,
          m - 1,
          d
        );

      date.setHours(0, 0, 0, 0);

      return date;
    }


    function getMonday(date) {

      const d =
        new Date(date);

      d.setHours(0, 0, 0, 0);

      const day =
        d.getDay();

      const diff =
        day === 0
          ? -6
          : 1 - day;

      d.setDate(
        d.getDate() + diff
      );

      return d;
    }


    function addDays(date, amount) {

      const d =
        new Date(date);

      d.setDate(
        d.getDate() + amount
      );

      return d;
    }


    function isSameDate(a, b) {

      return (
        dateKey(a) ===
        dateKey(b)
      );
    }


    function formatDateTitle(date) {

      return `${date.getMonth() + 1}월 ${date.getDate()}일`;
    }


    function formatWeekRange(start) {

      const end =
        addDays(start, 6);

      return (
        `${start.getMonth() + 1}월 ${start.getDate()}일 - ` +
        `${end.getMonth() + 1}월 ${end.getDate()}일`
      );
    }


    function getWeekday(date) {

      const names = [
        "일",
        "월",
        "화",
        "수",
        "목",
        "금",
        "토"
      ];

      return names[
        date.getDay()
      ];
    }


    /* =====================================
       WEEK
    ===================================== */

    function renderWeek() {

      weekGrid.innerHTML = "";

      weekRange.textContent =
        formatWeekRange(weekStart);


      for (
        let i = 0;
        i < 7;
        i++
      ) {

        const date =
          addDays(
            weekStart,
            i
          );


        const button =
          document.createElement("button");

        button.className =
          "day-button";


        if (
          isSameDate(
            date,
            selectedDate
          )
        ) {
          button.classList.add(
            "selected"
          );
        }


        const today =
          new Date();

        today.setHours(
          0, 0, 0, 0
        );


        if (
          isSameDate(
            date,
            today
          )
        ) {
          button.classList.add(
            "today"
          );
        }


        button.innerHTML = `
          <span class="weekday">
            ${getWeekday(date)}
          </span>

          <span class="day-number">
            ${date.getDate()}
          </span>
        `;


        button.addEventListener(
          "click",
          () => {

            selectedDate =
              new Date(date);

            renderApp();

          }
        );


        weekGrid.appendChild(
          button
        );

      }
    }


    /* =====================================
       PLANS
    ===================================== */

    function getPlansForDate(date) {

      const key =
        dateKey(date);

      return plans
        .filter(
          plan =>
            plan.date === key
        )
        .sort(
          (a, b) =>
            a.startTime.localeCompare(
              b.startTime
            )
        );
    }


    function renderPlans() {

      const todayPlans =
        getPlansForDate(
          selectedDate
        );


      plansContainer.innerHTML =
        "";


      plansCount.textContent =
        todayPlans.length === 0
          ? ""
          : `${todayPlans.length}개의 계획`;


      if (
        todayPlans.length === 0
      ) {

        plansContainer.innerHTML = `
          <div class="empty-state">

            <div>

              <strong>
                오늘의 계획이 없습니다.
              </strong>

              <span>
                오른쪽 아래 + 버튼으로<br>
                새로운 계획을 추가해보세요.
              </span>

            </div>

          </div>
        `;

        return;
      }


      todayPlans.forEach(
        plan => {

          const card =
            document.createElement(
              "article"
            );

          card.className =
            "plan-card";


          const taskHTML =
            plan.tasks
              .map(
                (task, index) => {

                  return `
                    <div class="task-row">

                      <input
                        type="checkbox"
                        class="task-check"
                        data-plan-id="${plan.id}"
                        data-task-index="${index}"
                        ${task.done ? "checked" : ""}
                      >

                      <span class="task-name">
                        ${escapeHTML(task.name)}
                      </span>

                      <span class="task-duration">
                        ${task.duration}분
                      </span>

                    </div>
                  `;

                }
              )
              .join("");


          card.innerHTML = `

            <div class="plan-top">

              <div>

                <div class="plan-name">
                  ${escapeHTML(
                    plan.name ||
                    "새 계획"
                  )}
                </div>

                <div class="plan-time">
                  ${plan.startTime} ~ ${plan.endTime}
                </div>

              </div>


              <button
                class="delete-plan"
                data-delete-id="${plan.id}"
                aria-label="계획 삭제"
              >
                ×
              </button>

            </div>


            <div class="task-list">
              ${taskHTML}
            </div>

          `;


          plansContainer.appendChild(
            card
          );

        }
      );


      document
        .querySelectorAll(
          ".delete-plan"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                deleteTargetId =
                  Number(
                    button.dataset
                      .deleteId
                  );

                deleteModal.classList.add(
                  "show"
                );

              }
            );

          }
        );


      document
        .querySelectorAll(
          ".task-check"
        )
        .forEach(
          check => {

            check.addEventListener(
              "change",
              () => {

                const id =
                  Number(
                    check.dataset
                      .planId
                  );

                const taskIndex =
                  Number(
                    check.dataset
                      .taskIndex
                  );


                const plan =
                  plans.find(
                    item =>
                      item.id === id
                  );


                if (!plan) return;


                plan.tasks[
                  taskIndex
                ].done =
                  check.checked;


                savePlans();

              }
            );

          }
        );

    }


    function renderApp() {

      dateTitle.textContent =
        formatDateTitle(
          selectedDate
        );


      datePicker.value =
        dateKey(
          selectedDate
        );


      renderWeek();
      renderPlans();
    }


    /* =====================================
       WEEK NAVIGATION
    ===================================== */

    prevWeek.addEventListener(
      "click",
      () => {

        weekStart =
          addDays(
            weekStart,
            -7
          );

        selectedDate =
          new Date(weekStart);

        renderApp();

      }
    );


    nextWeek.addEventListener(
      "click",
      () => {

        weekStart =
          addDays(
            weekStart,
            7
          );

        selectedDate =
          new Date(weekStart);

        renderApp();

      }
    );


    /* =====================================
       DATE PICKER
    ===================================== */

    datePicker.addEventListener(
      "change",
      () => {

        if (
          !datePicker.value
        ) return;


        selectedDate =
          parseDateKey(
            datePicker.value
          );


        weekStart =
          getMonday(
            selectedDate
          );


        renderApp();

      }
    );


    /* =====================================
       PLAN MODAL
    ===================================== */

    function openPlanModal() {

      planName.value = "";

      startTime.value =
        "10:00";

      endTime.value =
        "11:00";


      tasksEditor.innerHTML =
        "";


      addTaskEditorRow();


      planModal.classList.add(
        "show"
      );


      setTimeout(
        () => planName.focus(),
        50
      );
    }


    function closeModal() {

      planModal.classList.remove(
        "show"
      );
    }


    addPlanButton.addEventListener(
      "click",
      openPlanModal
    );


    closePlanModal.addEventListener(
      "click",
      closeModal
    );


    planModal.addEventListener(
      "click",
      event => {

        if (
          event.target === planModal
        ) {
          closeModal();
        }

      }
    );


    /* =====================================
       TASK EDITOR
    ===================================== */

    function normalizeDuration(value) {

      let number =
        Number(value);


      if (
        !Number.isFinite(number) ||
        number < 10
      ) {
        return 10;
      }


      number =
        Math.round(
          number / 10
        ) * 10;


      return Math.max(
        10,
        number
      );
    }


    function addTaskEditorRow(
      name = "",
      duration = 30
    ) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "editor-row";


      row.innerHTML = `

        <input
          type="text"
          class="input-field task-input"
          placeholder="할 일을 추가하세요"
          value="${escapeAttribute(name)}"
        >

        <input
          type="number"
          class="input-field duration-input"
          min="10"
          step="10"
          value="${normalizeDuration(duration)}"
          aria-label="소요 시간"
        >

        <button
          class="remove-task"
          type="button"
          aria-label="할 일 삭제"
        >
          ×
        </button>

      `;


      row
        .querySelector(
          ".remove-task"
        )
        .addEventListener(
          "click",
          () => {

            if (
              tasksEditor.children.length ===
              1
            ) {
              return;
            }

            row.remove();

          }
        );


      row
        .querySelector(
          ".duration-input"
        )
        .addEventListener(
          "blur",
          event => {

            event.target.value =
              normalizeDuration(
                event.target.value
              );

          }
        );


      tasksEditor.appendChild(
        row
      );
    }


    addTaskButton.addEventListener(
      "click",
      () => {

        addTaskEditorRow();

      }
    );


    /* =====================================
       SAVE PLAN
    ===================================== */

    savePlanButton.addEventListener(
      "click",
      () => {

        const name =
          planName.value.trim();


        const start =
          normalizeTime(
            startTime.value
          );


        const end =
          normalizeTime(
            endTime.value
          );


        if (!name) {

          alert(
            "계획 이름을 입력해주세요."
          );

          planName.focus();

          return;
        }


        if (!start || !end) {

          alert(
            "시간을 입력해주세요."
          );

          return;
        }


        if (start >= end) {

          alert(
            "종료 시간은 시작 시간보다 늦어야 합니다."
          );

          return;
        }


        const rows =
          [
            ...tasksEditor.querySelectorAll(
              ".editor-row"
            )
          ];


        const taskData =
          rows
            .map(
              row => {

                const taskName =
                  row
                    .querySelector(
                      ".task-input"
                    )
                    .value
                    .trim();


                const duration =
                  normalizeDuration(
                    row
                      .querySelector(
                        ".duration-input"
                      )
                      .value
                  );


                return {
                  name: taskName,
                  duration,
                  done: false
                };

              }
            )
            .filter(
              task =>
                task.name !== ""
            );


        if (
          taskData.length === 0
        ) {

          alert(
            "할 일을 하나 이상 입력해주세요."
          );

          return;
        }


        const newPlan = {

          id: Date.now(),

          date:
            dateKey(
              selectedDate
            ),

          name,

          startTime: start,

          endTime: end,

          tasks:
            taskData

        };


        plans.push(
          newPlan
        );


        savePlans();

        closeModal();

        renderPlans();

      }
    );


    /* =====================================
       DELETE
    ===================================== */

    confirmDelete.addEventListener(
      "click",
      () => {

        if (
          deleteTargetId === null
        ) return;


        plans =
          plans.filter(
            plan =>
              plan.id !==
              deleteTargetId
          );


        savePlans();


        deleteTargetId =
          null;


        deleteModal.classList.remove(
          "show"
        );


        renderPlans();

      }
    );


    cancelDelete.addEventListener(
      "click",
      () => {

        deleteTargetId =
          null;

        deleteModal.classList.remove(
          "show"
        );

      }
    );


    deleteModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          deleteModal
        ) {

          deleteTargetId =
            null;

          deleteModal.classList.remove(
            "show"
          );

        }

      }
    );


    /* =====================================
       STORAGE
    ===================================== */

    function savePlans() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(plans)
      );

    }


    /* =====================================
       HELPERS
    ===================================== */

    function normalizeTime(value) {

      if (!value) return "";


      const [
        hour,
        minute
      ] =
        value
          .split(":")
          .map(Number);


      if (
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
      ) {
        return "";
      }


      const totalMinutes =
        hour * 60 +
        Math.round(
          minute / 10
        ) * 10;


      const normalizedHour =
        Math.floor(
          totalMinutes / 60
        ) % 24;


      const normalizedMinute =
        totalMinutes % 60;


      return (
        `${String(normalizedHour).padStart(2, "0")}:` +
        `${String(normalizedMinute).padStart(2, "0")}`
      );
    }


    function escapeHTML(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    function escapeAttribute(value) {

      return escapeHTML(value);
    }


    /* =====================================
       INITIAL
    ===================================== */

    renderApp();

  </script>

</body>
</html>
