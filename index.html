<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fa">
<title>flowday</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #f7f8fa;
    --white: #ffffff;
    --navy: #111827;
    --black: #111318;
    --gray-900: #30343b;
    --gray-700: #626975;
    --gray-500: #9298a3;
    --gray-400: #adb2ba;
    --gray-300: #d7dae0;
    --gray-200: #e7e9ed;
    --gray-100: #f0f1f3;
    --shadow: 0 8px 28px rgba(17, 19, 24, 0.055);
    --shadow-hover: 0 14px 38px rgba(17, 19, 24, 0.09);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Inter", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--black);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

button,
input {
    font: inherit;
}

button {
    border: none;
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =====================================================
   LANDING
===================================================== */

.landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.landing-inner {
    width: min(1160px, calc(100% - 64px));
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 58px 0 45px;
}

.brand {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.055em;
}

.brand-flow {
    color: var(--black);
}

.brand-day {
    color: #8d929b;
}

.brand-mark {
    width: 29px;
    height: 29px;
    margin-right: 9px;
    border-radius: 9px;
    background: var(--black);
    color: white;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 800;
}

.hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(360px, 0.8fr);
    align-items: center;
    gap: clamp(50px, 8vw, 110px);
    margin-top: 66px;
}

.hero-copy {
    max-width: 600px;
}

.hero-title {
    font-size: clamp(46px, 6.4vw, 78px);
    line-height: 1.06;
    letter-spacing: -0.075em;
    font-weight: 800;
}

.hero-title span {
    display: block;
}

.hero-description {
    margin-top: 25px;
    color: var(--gray-700);
    font-size: 17px;
    line-height: 1.7;
    letter-spacing: -0.035em;
}

.start-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(360px, 100%);
    margin-top: 35px;
}

.primary-btn,
.google-btn {
    width: 100%;
    height: 55px;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
    transition: .2s ease;
}

.primary-btn {
    background: var(--black);
    color: white;
    box-shadow: 0 8px 22px rgba(17, 19, 24, .15);
}

.primary-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(17, 19, 24, .2);
}

.google-btn {
    background: white;
    color: var(--black);
    border: 1px solid var(--gray-200);
    box-shadow: var(--shadow);
}

.google-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
}

.google-icon {
    width: 18px;
    height: 18px;
}

/* =====================================================
   LANDING VISUAL
===================================================== */

.hero-visual {
    position: relative;
    height: 470px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.visual-glow {
    position: absolute;
    width: 370px;
    height: 370px;
    border-radius: 50%;
    background: #ebedf0;
}

.mockup {
    position: relative;
    width: 315px;
    padding: 9px;
    border-radius: 38px;
    background: #15171c;
    transform: rotate(3deg);
    box-shadow:
        0 35px 70px rgba(20, 24, 32, .18),
        0 10px 24px rgba(20, 24, 32, .08);
}

.mockup-screen {
    min-height: 490px;
    padding: 22px;
    border-radius: 30px;
    background: var(--bg);
    overflow: hidden;
}

.mockup-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mockup-date {
    color: var(--gray-500);
    font-size: 9px;
    font-weight: 700;
}

.mockup-title {
    margin-top: 25px;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.06em;
}

.mockup-card {
    margin-top: 18px;
    padding: 16px;
    border-radius: 17px;
    background: white;
    border: 1px solid var(--gray-200);
    box-shadow: var(--shadow);
}

.mockup-time {
    color: var(--gray-500);
    font-size: 9px;
    font-weight: 700;
}

.mockup-plan {
    margin-top: 7px;
    font-size: 14px;
    font-weight: 800;
}

.mockup-task {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--gray-700);
    font-size: 10px;
}

.mockup-check {
    width: 14px;
    height: 14px;
    border: 1px solid #cdd1d7;
    border-radius: 4px;
    background: white;
}

/* =====================================================
   QUOTE
===================================================== */

.quote-area {
    margin-top: 53px;
    max-width: 660px;
}

.quote-box {
    position: relative;
    padding: 17px 42px 17px 27px;
}

.quote-open,
.quote-close {
    position: absolute;
    color: #c8ccd2;
    font-family: Georgia, serif;
    font-size: 38px;
    line-height: 1;
}

.quote-open {
    left: 0;
    top: 0;
}

.quote-close {
    right: 0;
    bottom: -3px;
}

.quote-text {
    color: #777d87;
    font-family: Georgia, "Noto Sans KR", serif;
    font-size: 15px;
    line-height: 1.75;
    font-style: italic;
    letter-spacing: -0.02em;
}

.quote-author {
    margin-top: 7px;
    color: #a1a6ae;
    font-size: 11px;
}

.quote-change {
    width: 34px;
    height: 34px;
    margin-top: 8px;
    border-radius: 50%;
    background: transparent;
    color: #8e949d;
    display: grid;
    place-items: center;
    transition: .25s ease;
}

.quote-change:hover {
    color: var(--black);
    background: var(--gray-100);
}

.quote-change:active {
    transform: rotate(180deg);
}

.quote-change svg {
    width: 17px;
    height: 17px;
}

.landing-footer {
    width: min(1160px, calc(100% - 64px));
    margin: 0 auto;
    padding: 18px 0 24px;
    border-top: 1px solid var(--gray-200);
    color: #a5a9b0;
    font-size: 10px;
    letter-spacing: -0.01em;
}

/* =====================================================
   SCHEDULE PAGE
===================================================== */

.schedule-page {
    min-height: 100vh;
    padding-bottom: 110px;
}

.schedule-container {
    width: min(1040px, calc(100% - 64px));
    margin: 0 auto;
    padding-top: 27px;
}

.schedule-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* 그냥 < 모양 */

.back-btn {
    width: auto;
    height: auto;
    padding: 4px;
    background: transparent;
    color: var(--navy);
    font-size: 30px;
    line-height: 1;
    font-family: Arial, sans-serif;
    font-weight: 400;
    transition: transform .2s ease;
}

.back-btn:hover {
    transform: translateX(-3px);
}

/* G 내 플랜 */

.profile-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 2px;
    background: transparent;
    color: #757b85;
    font-size: 11px;
    font-weight: 600;
}

.profile-letter {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--black);
    color: white;
    display: grid;
    place-items: center;
    font-size: 9px;
    font-weight: 800;
}

/* =====================================================
   DATE HEADER
===================================================== */

.date-header {
    margin-top: 39px;
}

.date-label {
    color: var(--gray-500);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
}

.date-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
}

.date-title {
    font-size: clamp(37px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -0.07em;
}

.calendar-button {
    width: 35px;
    height: 35px;
    border-radius: 10px;
    background: transparent;
    color: #7c828c;
    display: grid;
    place-items: center;
    transition: .2s ease;
}

.calendar-button:hover {
    background: var(--gray-100);
    color: var(--black);
}

.calendar-button svg {
    width: 22px;
    height: 22px;
}

/* =====================================================
   WEEK SELECTOR
===================================================== */

.week-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 25px;
}

.week-label {
    color: #6e747e;
    font-size: 12px;
    font-weight: 700;
}

.week-controls {
    display: flex;
    align-items: center;
    gap: 4px;
}

.week-btn {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: transparent;
    color: #777d87;
    font-size: 18px;
    display: grid;
    place-items: center;
    transition: .2s ease;
}

.week-btn:hover {
    background: var(--gray-100);
    color: var(--black);
}

/* =====================================================
   WEEK CALENDAR
===================================================== */

.week-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 11px;
}

.date-item {
    min-width: 0;
    height: 75px;
    border-radius: 17px;
    background: white;
    border: 1px solid var(--gray-200);
    color: #8a9099;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: .2s ease;
}

.date-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}

.date-item.active {
    color: white;
    background: var(--black);
    border-color: var(--black);
    box-shadow: 0 8px 22px rgba(17, 19, 24, .16);
}

.date-week {
    font-size: 10px;
    font-weight: 600;
}

.date-number {
    font-size: 17px;
    font-weight: 800;
}

/* =====================================================
   PLANS
===================================================== */

.plan-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 25px;
}

.empty-state {
    padding: 68px 25px;
    border: 1px dashed #d6d9df;
    border-radius: 25px;
    background: white;
    text-align: center;
}

.empty-state strong {
    display: block;
    color: #555b65;
    font-size: 15px;
    margin-bottom: 8px;
}

.empty-state p {
    color: #9ba0a8;
    font-size: 12px;
}

.plan-card {
    position: relative;
    padding: 24px 27px;
    border: 1px solid var(--gray-200);
    border-radius: 23px;
    background: white;
    box-shadow: var(--shadow);
    transition: .2s ease;
}

.plan-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
}

.plan-time {
    color: #9298a2;
    font-size: 11px;
    font-weight: 700;
}

.plan-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-top: 7px;
}

.plan-title {
    color: #252930;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.045em;
}

.delete-plan {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    background: var(--gray-100);
    color: #91969e;
    display: grid;
    place-items: center;
    transition: .2s ease;
}

.delete-plan:hover {
    background: #e5e7ea;
    color: var(--black);
}

.delete-plan svg {
    width: 14px;
    height: 14px;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
}

.task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 31px;
    cursor: pointer;
}

.task-checkbox {
    appearance: none;
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
    border: 1.5px solid #cdd1d8;
    border-radius: 7px;
    background: white;
    position: relative;
    transition: .2s ease;
}

.task-checkbox:checked {
    background: var(--black);
    border-color: var(--black);
}

.task-checkbox:checked::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 10px;
    left: 6px;
    top: 3px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

.task-text {
    color: #353a42;
    font-size: 16px;
    line-height: 1.45;
    font-weight: 500;
    letter-spacing: -0.025em;
}

.task-item.completed .task-text {
    color: #a4a9b1;
    text-decoration: line-through;
}

.task-minutes {
    margin-left: auto;
    color: #9ba0a8;
    font-size: 11px;
    white-space: nowrap;
}

/* =====================================================
   FAB
===================================================== */

.fab {
    position: fixed;
    right: max(25px, calc((100vw - 1040px) / 2));
    bottom: 27px;
    width: 57px;
    height: 57px;
    border-radius: 19px;
    background: var(--black);
    color: white;
    display: grid;
    place-items: center;
    box-shadow: 0 12px 30px rgba(17, 19, 24, .22);
    transition: .2s ease;
    z-index: 20;
}

.fab:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 34px rgba(17, 19, 24, .28);
}

.fab svg {
    width: 22px;
    height: 22px;
}

/* =====================================================
   MODALS
===================================================== */

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    padding: 20px;
    background: rgba(15, 18, 23, .43);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn .2s ease;
}

.modal {
    width: min(500px, 100%);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    padding: 28px;
    border-radius: 27px;
    background: white;
    box-shadow: 0 30px 80px rgba(10, 13, 18, .22);
    animation: modalIn .25s ease;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.modal-title {
    color: #181b20;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.05em;
}

.modal-close {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--gray-100);
    color: #777d86;
    display: grid;
    place-items: center;
}

.modal-close svg {
    width: 16px;
    height: 16px;
}

.form-group {
    margin-top: 22px;
}

.form-label {
    display: block;
    margin-bottom: 8px;
    color: #777d87;
    font-size: 11px;
    font-weight: 700;
}

.form-input {
    width: 100%;
    height: 47px;
    padding: 0 13px;
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    outline: none;
    background: #fafbfc;
    color: var(--black);
    transition: .2s ease;
}

.form-input:focus {
    border-color: #b5bac2;
    box-shadow: 0 0 0 4px #f0f1f3;
}

.time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.task-input-row {
    display: flex;
    gap: 7px;
}

.task-input {
    flex: 1;
}

.minutes-input {
    width: 82px;
}

.add-task-btn {
    width: 47px;
    height: 47px;
    flex: 0 0 47px;
    border-radius: 12px;
    background: var(--black);
    color: white;
    display: grid;
    place-items: center;
}

.add-task-btn svg {
    width: 17px;
    height: 17px;
}

.modal-task-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 11px;
}

.modal-task {
    min-height: 43px;
    padding: 9px 11px;
    border-radius: 11px;
    background: #f4f5f7;
    display: flex;
    align-items: center;
    gap: 9px;
}

.modal-task-text {
    flex: 1;
    color: #454a53;
    font-size: 13px;
}

.remove-task {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: transparent;
    color: #9499a1;
}

.modal-submit {
    width: 100%;
    height: 52px;
    margin-top: 24px;
    border-radius: 14px;
    background: var(--black);
    color: white;
    font-size: 14px;
    font-weight: 700;
}

/* =====================================================
   DATE PICKER
===================================================== */

.date-picker-modal {
    width: min(370px, 100%);
    padding: 25px;
    border-radius: 25px;
    background: white;
    box-shadow: 0 30px 80px rgba(10, 13, 18, .22);
}

.date-picker-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.04em;
}

.date-picker-input {
    margin-top: 20px;
}

/* =====================================================
   CONFIRM
===================================================== */

.confirm-modal {
    width: min(390px, 100%);
    padding: 30px;
    border-radius: 25px;
    background: white;
    text-align: center;
    box-shadow: 0 30px 80px rgba(10, 13, 18, .22);
    animation: modalIn .25s ease;
}

.confirm-icon {
    width: 47px;
    height: 47px;
    margin: 0 auto 17px;
    border-radius: 15px;
    background: var(--gray-100);
    color: #555b65;
    display: grid;
    place-items: center;
}

.confirm-icon svg {
    width: 21px;
    height: 21px;
}

.confirm-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.04em;
}

.confirm-description {
    margin-top: 7px;
    color: #8b919a;
    font-size: 12px;
}

.confirm-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 23px;
}

.confirm-btn {
    height: 47px;
    border-radius: 13px;
    font-size: 13px;
    font-weight: 700;
}

.confirm-yes {
    background: var(--black);
    color: white;
}

.confirm-no {
    background: var(--gray-100);
    color: #555b64;
}

/* =====================================================
   ANIMATION
===================================================== */

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 850px) {

    .landing-inner {
        width: min(100% - 42px, 620px);
        padding-top: 38px;
    }

    .hero {
        grid-template-columns: 1fr;
        gap: 40px;
        margin-top: 60px;
    }

    .hero-copy {
        max-width: none;
    }

    .hero-visual {
        height: 390px;
    }

    .mockup {
        width: 275px;
    }

    .mockup-screen {
        min-height: 430px;
    }

    .quote-area {
        margin-top: 30px;
    }

    .landing-footer {
        width: min(100% - 42px, 620px);
    }

    .schedule-container {
        width: min(100% - 36px, 700px);
    }

    .fab {
        right: 20px;
    }
}

@media (max-width: 560px) {

    .landing-inner {
        width: calc(100% - 32px);
        padding: 27px 0 32px;
    }

    .brand {
        font-size: 17px;
    }

    .brand-mark {
        width: 27px;
        height: 27px;
    }

    .hero {
        margin-top: 54px;
        gap: 28px;
    }

    .hero-title {
        font-size: clamp(42px, 13vw, 57px);
    }

    .hero-description {
        margin-top: 18px;
        font-size: 14px;
    }

    .start-buttons {
        margin-top: 27px;
    }

    .hero-visual {
        height: 310px;
    }

    .visual-glow {
        width: 250px;
        height: 250px;
    }

    .mockup {
        width: 230px;
        padding: 8px;
        border-radius: 30px;
    }

    .mockup-screen {
        min-height: 360px;
        padding: 16px;
        border-radius: 23px;
    }

    .mockup-title {
        margin-top: 19px;
        font-size: 20px;
    }

    .quote-area {
        margin-top: 20px;
    }

    .quote-text {
        font-size: 13px;
    }

    .landing-footer {
        width: calc(100% - 32px);
    }

    .schedule-container {
        width: calc(100% - 28px);
        padding-top: 17px;
    }

    .date-header {
        margin-top: 28px;
    }

    .date-title {

<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY = "flowday_plans_v4";

let plans = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
);

let selectedDate = formatDate(new Date());

let modalTasks = [];

let deleteTargetId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const landingPage = document.getElementById("landingPage");
const schedulePage = document.getElementById("schedulePage");

const startBtn = document.getElementById("startBtn");
const googleBtn = document.getElementById("googleBtn");
const backBtn = document.getElementById("backBtn");

const profileLetter = document.getElementById("profileLetter");
const profileText = document.getElementById("profileText");

const currentDateTitle =
    document.getElementById("currentDateTitle");

const weekCalendar =
    document.getElementById("weekCalendar");

const weekLabel =
    document.getElementById("weekLabel");

const planList =
    document.getElementById("planList");

const prevWeekBtn =
    document.getElementById("prevWeekBtn");

const nextWeekBtn =
    document.getElementById("nextWeekBtn");

const calendarButton =
    document.getElementById("calendarButton");

const datePickerModal =
    document.getElementById("datePickerModal");

const calendarDateInput =
    document.getElementById("calendarDateInput");

const closeDatePicker =
    document.getElementById("closeDatePicker");

const addPlanBtn =
    document.getElementById("addPlanBtn");

const planModal =
    document.getElementById("planModal");

const closePlanModal =
    document.getElementById("closePlanModal");

const planDate =
    document.getElementById("planDate");

const planName =
    document.getElementById("planName");

const planStart =
    document.getElementById("planStart");

const planEnd =
    document.getElementById("planEnd");

const taskInput =
    document.getElementById("taskInput");

const taskMinutes =
    document.getElementById("taskMinutes");

const addTaskBtn =
    document.getElementById("addTaskBtn");

const modalTaskList =
    document.getElementById("modalTaskList");

const savePlanBtn =
    document.getElementById("savePlanBtn");

const deleteModal =
    document.getElementById("deleteModal");

const confirmDeleteBtn =
    document.getElementById("confirmDeleteBtn");

const cancelDeleteBtn =
    document.getElementById("cancelDeleteBtn");

const quoteText =
    document.getElementById("quoteText");

const quoteAuthor =
    document.getElementById("quoteAuthor");

const quoteChangeBtn =
    document.getElementById("quoteChangeBtn");


/* =====================================================
   QUOTES
===================================================== */

const quotes = [
    {
        text: "천재는 1%의 영감과 99%의 노력으로 이루어진다.",
        author: "토머스 에디슨"
    },
    {
        text: "교육은 세상을 바꾸는 데 사용할 수 있는 가장 강력한 무기이다.",
        author: "넬슨 만델라"
    },
    {
        text: "교육의 뿌리는 쓰지만 그 열매는 달다.",
        author: "아리스토텔레스"
    },
    {
        text: "배움은 정신을 결코 지치게 하지 않는다.",
        author: "레오나르도 다 빈치"
    },
    {
        text: "어떤 분야의 전문가도 한때는 초보자였다.",
        author: "헬렌 헤이스"
    },
    {
        text: "읽기는 마음에 지식의 재료를 제공할 뿐이고, 우리가 읽은 것을 자신의 것으로 만드는 것은 생각이다.",
        author: "존 로크"
    },
    {
        text: "반박하고 논박하기 위해 읽지 말고, 무조건 믿기 위해서도 읽지 말라. 깊이 생각하고 판단하기 위해 읽어라.",
        author: "프랜시스 베이컨"
    },
    {
        text: "독서는 사람을 풍요롭게 하고, 대화는 준비된 사람으로 만들며, 글쓰기는 정확한 사람으로 만든다.",
        author: "프랜시스 베이컨"
    },
    {
        text: "교육은 미래로 가는 여권이다. 내일은 오늘 그것을 준비하는 사람들의 것이다.",
        author: "말콤 X"
    }
];

let quoteIndex =
    Math.floor(Math.random() * quotes.length);


function renderQuote() {

    const quote = quotes[quoteIndex];

    quoteText.textContent = quote.text;

    quoteAuthor.textContent =
        "© " + quote.author;

}


quoteChangeBtn.addEventListener("click", () => {

    quoteIndex =
        (quoteIndex + 1) % quotes.length;

    renderQuote();

});


/* =====================================================
   DATE FUNCTIONS
===================================================== */

function formatDate(date) {

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const day =
        String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function parseDate(dateString) {

    const [
        year,
        month,
        day
    ] = dateString.split("-").map(Number);

    return new Date(year, month - 1, day);
}


function getKoreanWeekday(date) {

    return [
        "일",
        "월",
        "화",
        "수",
        "목",
        "금",
        "토"
    ][date.getDay()];

}


/* =====================================================
   WEEK FUNCTIONS
===================================================== */

function getMonday(date) {

    const d = new Date(date);

    const day = d.getDay();

    const difference =
        day === 0 ? -6 : 1 - day;

    d.setDate(d.getDate() + difference);

    return d;

}


function renderWeek() {

    weekCalendar.innerHTML = "";

    const selected =
        parseDate(selectedDate);

    const monday =
        getMonday(selected);


    const sunday =
        new Date(monday);

    sunday.setDate(
        monday.getDate() + 6
    );


    weekLabel.textContent =
        `${monday.getMonth() + 1}월 ${monday.getDate()}일 ~ ` +
        `${sunday.getMonth() + 1}월 ${sunday.getDate()}일`;


    for (let i = 0; i < 7; i++) {

        const date =
            new Date(monday);

        date.setDate(
            monday.getDate() + i
        );

        const dateString =
            formatDate(date);

        const button =
            document.createElement("button");

        button.className =
            "date-item" +
            (
                dateString === selectedDate
                    ? " active"
                    : ""
            );


        button.innerHTML = `
            <span class="date-week">
                ${getKoreanWeekday(date)}
            </span>

            <span class="date-number">
                ${date.getDate()}
            </span>
        `;


        button.addEventListener(
            "click",
            () => {

                selectedDate =
                    dateString;

                renderSchedule();

            }
        );


        weekCalendar.appendChild(button);

    }

}


function moveWeek(amount) {

    const date =
        parseDate(selectedDate);

    date.setDate(
        date.getDate() + amount * 7
    );

    selectedDate =
        formatDate(date);

    renderSchedule();

}


prevWeekBtn.addEventListener(
    "click",
    () => moveWeek(-1)
);

nextWeekBtn.addEventListener(
    "click",
    () => moveWeek(1)
);


/* =====================================================
   CURRENT DATE
===================================================== */

function renderCurrentDate() {

    const date =
        parseDate(selectedDate);

    currentDateTitle.textContent =
        `${date.getMonth() + 1}월 ${date.getDate()}일`;

}


/* =====================================================
   PLAN RENDERING
===================================================== */

function renderPlans() {

    planList.innerHTML = "";


    const filteredPlans =
        plans
            .filter(
                plan =>
                    plan.date === selectedDate
            )
            .sort(
                (a, b) =>
                    a.start.localeCompare(b.start)
            );


    if (filteredPlans.length === 0) {

        planList.innerHTML = `
            <div class="empty-state">

                <strong>
                    오늘의 계획이 없습니다.
                </strong>

                <p>
                    오른쪽 아래 + 버튼으로 계획을 추가해보세요.
                </p>

            </div>
        `;

        return;

    }


    filteredPlans.forEach(plan => {

        const card =
            document.createElement("div");

        card.className = "plan-card";


        card.innerHTML = `

            <div class="plan-time">
                ${plan.start} ~ ${plan.end}
            </div>

            <div class="plan-title-row">

                <div class="plan-title">
                    ${escapeHTML(plan.name)}
                </div>

                <button
                    class="delete-plan"
                    data-id="${plan.id}"
                    aria-label="계획 삭제"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path d="M6 6l12 12M18 6L6 18"/>
                    </svg>

                </button>

            </div>


            <div class="task-list">

                ${plan.tasks.map(
                    (task, index) => `

                    <label
                        class="task-item ${
                            task.completed
                                ? "completed"
                                : ""
                        }"
                        data-plan-id="${plan.id}"
                        data-task-index="${index}"
                    >

                        <input
                            type="checkbox"
                            class="task-checkbox"
                            ${
                                task.completed
                                    ? "checked"
                                    : ""
                            }
                        >

                        <span class="task-text">
                            ${escapeHTML(task.text)}
                        </span>

                        ${
                            task.minutes
                                ? `
                                <span class="task-minutes">
                                    ${task.minutes}분
                                </span>
                                `
                                : ""
                        }

                    </label>

                `
                ).join("")}

            </div>

        `;


        planList.appendChild(card);

    });


    document
        .querySelectorAll(".delete-plan")
        .forEach(button => {

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    deleteTargetId =
                        button.dataset.id;

                    deleteModal
                        .classList
                        .remove("hidden");

                }
            );

        });


    document
        .querySelectorAll(".task-item")
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    toggleTask(
                        item.dataset.planId,
                        Number(
                            item.dataset.taskIndex
                        )
                    );

                }
            );

        });

}


function toggleTask(
    planId,
    taskIndex
) {

    const plan =
        plans.find(
            item =>
                String(item.id) ===
                String(planId)
        );

    if (!plan) return;

    plan.tasks[taskIndex].completed =
        !plan.tasks[taskIndex].completed;

    savePlans();

    renderPlans();

}


/* =====================================================
   STORAGE
===================================================== */

function savePlans() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(plans)
    );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   SCHEDULE
===================================================== */

function renderSchedule() {

    renderCurrentDate();

    renderWeek();

    renderPlans();

}


/* =====================================================
   OPEN SCHEDULE
===================================================== */

function openSchedule() {

    landingPage.classList.add("hidden");

/* =====================================================
   PLAN MODAL
===================================================== */

function openPlanModal() {

    planModal
        .classList
        .remove("hidden");

    planDate.value =
        selectedDate;

    planName.value = "";

    planStart.value =
        "10:00";

    planEnd.value =
        "12:00";

    taskInput.value = "";

    taskMinutes.value =
        "30";

    modalTasks = [];

    renderModalTasks();

}


function closePlanModalFunc() {

    planModal
        .classList
        .add("hidden");

}


addPlanBtn.addEventListener(
    "click",
    openPlanModal
);

closePlanModal.addEventListener(
    "click",
    closePlanModalFunc
);


/* =====================================================
   MODAL TASKS
===================================================== */

function addModalTask() {

    const text =
        taskInput.value.trim();

    if (!text) {

        taskInput.focus();

        return;

    }


    let minutes =
        Number(taskMinutes.value);


    if (!minutes || minutes < 10) {

        minutes = 10;

    }


    minutes =
        Math.round(minutes / 10) * 10;


    modalTasks.push({

        text,

        minutes,

        completed: false

    });


    taskInput.value = "";

    taskMinutes.value =
        "30";


    renderModalTasks();

    taskInput.focus();

}


addTaskBtn.addEventListener(
    "click",
    addModalTask
);


taskInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            addModalTask();

        }

    }
);


function renderModalTasks() {

    modalTaskList.innerHTML = "";


    modalTasks.forEach(
        (task, index) => {

            const item =
                document.createElement("div");

            item.className =
                "modal-task";


            item.innerHTML = `

                <span class="modal-task-text">
                    ${escapeHTML(task.text)}
                </span>

                <span
                    style="
                        font-size:11px;
                        color:#9298a1;
                    "
                >
                    ${task.minutes}분
                </span>

                <button
                    class="remove-task"
                    data-index="${index}"
                >
                    ×
                </button>

            `;


            modalTaskList.appendChild(item);

        }
    );


    document
        .querySelectorAll(".remove-task")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const index =
                        Number(
                            button.dataset.index
                        );

                    modalTasks.splice(
                        index,
                        1
                    );

                    renderModalTasks();

                }
            );

        });

}


/* =====================================================
   SAVE PLAN
===================================================== */

savePlanBtn.addEventListener(
    "click",
    () => {

        const date =
            planDate.value;

        const name =
            planName.value.trim();

        const start =
            planStart.value;

        const end =
            planEnd.value;


        if (!date) {

            alert(
                "날짜를 선택해주세요."
            );

            return;

        }


        if (!name) {

            alert(
                "계획 이름을 입력해주세요."
            );

            planName.focus();

            return;

        }


        if (!start || !end) {

            alert(
                "시간을 입력해주세요."
            );

            return;

        }


        if (start >= end) {

            alert(
                "종료 시간은 시작 시간보다 늦어야 합니다."
            );

            return;

        }


        if (modalTasks.length === 0) {

            alert(
                "해야 할 일을 하나 이상 추가해주세요."
            );

            taskInput.focus();

            return;

        }


        const newPlan = {

            id:
                Date.now().toString(),

            date,

            name,

            start,

            end,

            tasks:
                modalTasks.map(
                    task => ({
                        ...task
                    })
                )

        };


        plans.push(newPlan);

        savePlans();

        selectedDate =
            date;

        closePlanModalFunc();

        renderSchedule();

    }
);


/* =====================================================
   DATE PICKER
===================================================== */

calendarButton.addEventListener(
    "click",
    () => {

        calendarDateInput.value =
            selectedDate;

        datePickerModal
            .classList
            .remove("hidden");

    }
);


closeDatePicker.addEventListener(
    "click",
    () => {

        datePickerModal
            .classList
            .add("hidden");

    }
);


calendarDateInput.addEventListener(
    "change",
    () => {

        if (!calendarDateInput.value)
            return;

        selectedDate =
            calendarDateInput.value;

        datePickerModal
            .classList
            .add("hidden");

        renderSchedule();

    }
);


/* =====================================================
   DELETE
===================================================== */

confirmDeleteBtn.addEventListener(
    "click",
    () => {

        if (!deleteTargetId)
            return;


        plans =
            plans.filter(
                plan =>
                    String(plan.id) !==
                    String(deleteTargetId)
            );


        savePlans();

        deleteTargetId = null;

        deleteModal
            .classList
            .add("hidden");

        renderSchedule();

    }
);


cancelDeleteBtn.addEventListener(
    "click",
    () => {

        deleteTargetId = null;

        deleteModal
            .classList
            .add("hidden");

    }
);


/* =====================================================
   OUTSIDE MODAL CLICK
===================================================== */

planModal.addEventListener(
    "click",
    event => {

        if (event.target === planModal) {

            closePlanModalFunc();

        }

    }
);


datePickerModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            datePickerModal
        ) {

            datePickerModal
                .classList
                .add("hidden");

        }

    }
);


deleteModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            deleteModal
        ) {

            deleteTargetId = null;

            deleteModal
                .classList
                .add("hidden");

        }

    }
);
